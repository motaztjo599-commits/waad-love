            --pink-soft: #fbb1bd;

        * {

        }

        body {

            min-height: 100vh;
            overflow-x: hidden;
            position: relative;

        /* Canvas Particles Background */
        #canvas-bg {

            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Top Navigation Bar */
        .top-nav {
            position: fixed;
            top: 15px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .badge-score {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--pink-main);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            color: var(--pink-dark);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(255, 133, 161, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--pink-main);
            color: var(--pink-dark);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 133, 161, 0.3);
        }
        .sound-btn:hover {
            background: var(--pink-main);
            color: white;
            transform: scale(1.05);
        }

            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

            background: var(--white-glass);
            border: 3px solid var(--card-border);
            border-radius: 40px;
            padding: 40px 25px;
            max-width: 750px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 45px rgba(255, 133, 161, 0.25);

            border-radius: 30px;

            color: var(--pink-dark);

        .music-artist {

    /* Web Audio API Synthesizer - 20 Ultra Cute Harmonics */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    // 20 Delicate Cute Frequencies for 20 Questions
    const cuteFrequencies = [
        523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50,
        1174.66, 1318.51, 1396.91, 1567.98, 1760.00, 1975.53, 2093.00,
        2349.32, 2637.02, 2793.83, 3135.96, 3520.00
    ];

    function playCuteSound(stepIndex) {
        if (!state.soundEnabled) return;
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            const freq = cuteFrequencies[stepIndex % 20] || 523.25;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.33, now + 0.18);
            
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

            osc.start(now);
            osc.stop(now + 0.28);
        } catch(e) { console.log(e); }
    }

    function toggleAudio() {
        state.soundEnabled = !state.soundEnabled;

    /* Floating Pink Particles */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 4 + 1.5;
            this.speedX = (Math.random() - 0.5) * 0.7;
            this.speedY = (Math.random() - 0.5) * 0.7;
            this.color = ['#ff85a1', '#fbb1bd', '#ffccd5', '#ffffff', '#ffb703'][Math.floor(Math.random() * 5)];
            this.alpha = Math.random() * 0.7 + 0.3;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 75; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* Rendering Logic */
    function renderStage(index) {
        state.currentStep = index;
        const card = document.getElementById('main-card');
        
        if (index === 0) {
            const d = stagesData[0];
            card.innerHTML = `
                <div class="kitty-header-icon">🐱🎀</div>
                <br><div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <button class="btn-action" onclick="stagesData[0].action();">${d.btnText}</button>
            `;
            return;
        }

        if (index === 1) {
            const d = stagesData[1];
            card.innerHTML = `
                <div class="kitty-header-icon">🔒🌸</div>
                <br><div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <div class="pass-display" id="pass-box">----</div>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}
                    <button class="key-btn" style="color:var(--pink-main);" onclick="pressKey('C')">⌫</button>
                </div>
            `;
            return;
        }

        if (index >= 2 && index < stagesData.length) {
            const d = stagesData[index];
            const progress = Math.round(((index - 1) / (stagesData.length - 2)) * 100);

            // Play delicate cute sound for each question
            playCuteSound(index - 2);

            card.innerHTML = `
                <div class="progress-box"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                <div class="title-tag">${d.tag}</div>
                <h2 class="main-heading">${d.title}</h2>
                <div class="options-grid">
                    ${d.options.map((opt, i) => `
                        <div class="option-card" id="opt-${i}" onclick="selectOption(${index}, ${i})">
                            <span>${opt.text}</span>
                            <span>🎀</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback"></div>
                <button class="btn-action" id="next-btn" style="display:none;" onclick="spawnFloatingEmoji(); renderStage(${index + 1});">المحطة التالية 🌸🚀</button>
            `;
            return;
        }

        if (index === stagesData.length) {
            spawnFloatingEmoji('👑');
            renderFinalLetter();
        }
    }

    function pressKey(val) {
        playCuteSound(state.enteredPass.length);
        const box = document.getElementById('pass-box');
        if (val === 'C') {
            state.enteredPass = "";
        } else {
            if (state.enteredPass.length < 4) state.enteredPass += val;
        }
        box.innerText = state.enteredPass.padEnd(4, '-');

        if (state.enteredPass === "2707" || state.enteredPass === "0608") {
            box.style.borderColor = "#2a9d8f";
            box.style.color = "#2a9d8f";
            setTimeout(() => {
                renderStage(2);
            }, 500);
        } else if (state.enteredPass.length === 4) {
            box.style.borderColor = "#e63946";
            setTimeout(() => {
                state.enteredPass = "";
                box.innerText = "----";
                box.style.borderColor = "var(--pink-main)";
            }, 700);
        }
    }

    function selectOption(stageIdx, optIdx) {
        playCuteSound(stageIdx);
        const stage = stagesData[stageIdx];
        const opt = stage.options[optIdx];

        const cards = document.querySelectorAll('.option-card');
        cards.forEach((c, i) => {
            if (i === optIdx) c.classList.add('selected');
            else c.classList.remove('selected');
        });

        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>رد معتز:</strong> ${opt.feedback}`;

        if (!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function toggleMusic() {
        const song = document.getElementById('love-song');
        const btn = document.getElementById('music-toggle-btn');
        if (song.paused) {
            song.play();
            btn.innerText = "⏸️ إيقاف الموسيقى";
        } else {
            song.pause();
            btn.innerText = "▶️ تشغيل الموسيقى";
        }
    }
