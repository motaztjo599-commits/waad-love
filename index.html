<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وعدي كل دنيتي ومرتي وكلشي بحياتي | النظام الكوني المطلق 🌌✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:ital,wght@0,700;1,400&family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --bg-primary: #030006;
            --accent-glow: #ff007f;
            --card-glass: rgba(10, 5, 20, 0.85);
            --border-color: rgba(255, 0, 127, 0.4);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .hud-nav {
            position: fixed;
            top: 20px; left: 25px; right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(15px);
            background: rgba(10, 5, 20, 0.7);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.2);
            transition: border-color 1s;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ff3399;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-hud-btn {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            transition: all 0.3s;
        }
        .audio-hud-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.8);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .future-card {
            background: var(--card-glass);
            border: 2px solid var(--border-color);
            border-radius: 35px;
            padding: 50px 35px;
            max-width: 950px;
            width: 100%;
            backdrop-filter: blur(40px);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: border-color 1s, box-shadow 1s;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .quantum-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: inline-block;
            animation: quantumFloat 3s infinite alternate ease-in-out;
        }

        @keyframes quantumFloat {
            0% { transform: translateY(0) rotate(0deg) scale(1); filter: drop-shadow(0 0 10px rgba(255,0,127,0.5)); }
            100% { transform: translateY(-12px) rotate(5deg) scale(1.1); filter: drop-shadow(0 0 25px rgba(0,255,255,0.8)); }
        }

        .tag-hud {
            display: inline-block;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 25px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            transition: border-color 1s, color 1s;
        }

        .main-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.5;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .sub-desc {
            font-size: 16.5px;
            color: #d8b4fe;
            line-height: 1.9;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .progress-hud {
            width: 100%; height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 35px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff007f, #00f0ff, #7928ca);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px #ff007f;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .option-node {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 20px 25px;
            border-radius: 20px;
            text-align: right;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
            font-size: 16.5px;
            font-weight: 700;
            backdrop-filter: blur(10px);
        }

        .option-node:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-glow);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.3);
        }

        .option-node.active-selected {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.4), rgba(121, 40, 202, 0.4));
            border-color: var(--accent-glow);
            box-shadow: 0 0 35px var(--accent-glow);
            transform: scale(1.02);
        }

        .feedback-terminal {
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed var(--accent-glow);
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
            font-size: 16px;
            color: #ff99c8;
            line-height: 1.8;
            display: none;
            text-align: right;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .keypad-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 340px;
            margin: 25px auto;
        }

        .quantum-key {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .quantum-key:active {
            transform: scale(0.88);
            background: var(--accent-glow);
            border-color: #fff;
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .pass-screen {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--accent-glow);
            border-radius: 20px;
            padding: 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            letter-spacing: 15px;
            color: var(--accent-glow);
            margin-bottom: 30px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(255,0,127,0.3);
        }

        .action-btn {
            background: linear-gradient(135deg, #ff007f, #00f0ff);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 40px rgba(255, 0, 127, 0.5);
            margin-top: 25px;
            display: inline-block;
        }

        .action-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 15px 50px rgba(0, 240, 255, 0.8);
        }

        .audio-player-hud {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent-glow);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
        }

        .audio-title-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 12px;
        }

        .audio-sub-text {
            font-size: 14px;
            color: #d8b4fe;
            margin-bottom: 20px;
        }

        .cyber-letter {
            text-align: right;
            max-height: 600px;
            overflow-y: auto;
            padding: 40px 35px;
            background: rgba(5, 2, 10, 0.9);
            border-radius: 30px;
            border: 2px solid var(--accent-glow);
            line-height: 2.8;
            font-size: 18px;
            color: #f3e8ff;
            margin-top: 25px;
            box-shadow: inset 0 0 30px rgba(255, 0, 127, 0.2);
            scrollbar-width: thin;
            scrollbar-color: var(--accent-glow) rgba(0,0,0,0.5);
        }

        .cyber-letter::-webkit-scrollbar { width: 8px; }
        .cyber-letter::-webkit-scrollbar-thumb { background: var(--accent-glow); border-radius: 10px; }

        .chapter-title {
            color: #00f0ff;
            font-family: 'Amiri', serif;
            font-size: 28px;
            margin: 45px 0 20px 0;
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
            font-weight: 700;
        }

        .chapter-p {
            margin-bottom: 25px;
            position: relative;
            padding-right: 32px;
            font-weight: 600;
        }
        .chapter-p::before {
            content: "💎";
            position: absolute;
            right: 0; top: 2px;
            font-size: 15px;
        }

        .cyber-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .cyber-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-glow);
            border-radius: 20px;
            padding: 15px;
            font-size: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255,0,127,0.2);
        }

        .floating-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: floatUpParticle 3.5s ease-out forwards;
            font-size: 28px;
        }

        @keyframes floatUpParticle {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.8) rotate(360deg); }
        }

        @media (max-width: 768px) {
            .future-card { padding: 30px 20px; }
            .cyber-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 22px; }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<!-- Background Music: Guaranteed Direct Audio Stream -->
<audio id="master-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div class="hud-nav">
    <div class="hud-title">
        <span>⚡ وعدي كل دنيتي ومرتي وكلشي بحياتي</span>
    </div>
    <button class="audio-hud-btn" onclick="toggleMasterAudio()">🎵 تشغيل الموسيقى</button>
</div>

<div class="main-wrapper">
    <div class="future-card" id="quantum-card"></div>
</div>

<script>
    /* Dynamic Cybernetic Color Themes for Each Question */
    const themes = [
        { primary: "#ff007f", secondary: "#7928ca", bg: "#05000a", border: "rgba(255,0,127,0.6)" },
        { primary: "#00f0ff", secondary: "#0066ff", bg: "#00050f", border: "rgba(0,240,255,0.6)" },
        { primary: "#10b981", secondary: "#047857", bg: "#020a05", border: "rgba(16,185,129,0.6)" },
        { primary: "#f59e0b", secondary: "#d97706", bg: "#0a0700", border: "rgba(245,158,11,0.6)" },
        { primary: "#8b5cf6", secondary: "#6d28d9", bg: "#07020f", border: "rgba(139,92,246,0.6)" },
        { primary: "#ec4899", secondary: "#be185d", bg: "#0a0105", border: "rgba(236,72,153,0.6)" },
        { primary: "#06b6d4", secondary: "#0e7490", bg: "#02080a", border: "rgba(6,182,212,0.6)" },
        { primary: "#eab308", secondary: "#ca8a04", bg: "#0a0900", border: "rgba(234,179,8,0.6)" },
        { primary: "#6366f1", secondary: "#4338ca", bg: "#04040f", border: "rgba(99,102,241,0.6)" },
        { primary: "#f43f5e", secondary: "#9f1239", bg: "#0a0103", border: "rgba(244,63,94,0.6)" }
    ];

    function applyTheme(index) {
        const theme = themes[index % themes.length];
        document.documentElement.style.setProperty('--accent-glow', theme.primary);
        document.documentElement.style.setProperty('--border-color', theme.border);
        document.body.style.backgroundColor = theme.bg;
        const hud = document.querySelector('.hud-nav');
        if(hud) hud.style.borderColor = theme.border;
    }

    const state = {
        currentStep: 0,
        unlockedBadges: [],
        enteredPass: "",
        audioActive: false
    };

    function toggleMasterAudio() {
        const audio = document.getElementById('master-audio');
        const btn = document.querySelector('.audio-hud-btn');
        state.audioActive = !state.audioActive;
        if(state.audioActive) {
            audio.play().then(() => {
                btn.innerText = "🎵 الموسيقى: نشطة";
            }).catch(e => {
                alert("اضغط في أي مكان بالشاشة لتفعيل الصوت الكوني!");
            });
        } else {
            audio.pause();
            btn.innerText = "🎵 تشغيل الموسيقى";
        }
    }

    /* Web Audio API - Deep Zen Chimes */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const frequencies = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function playQuantumChime(idx) {
        try {
            if(!audioCtx) audioCtx = new AudioCtx();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequencies[idx % frequencies.length], now);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
            osc.start(now);
            osc.stop(now + 0.7);
        } catch(e) {}
    }

    /* Matrix Neural Canvas */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3.5 + 1;
            this.speedX = (Math.random() - 0.5) * 0.6;
            this.speedY = (Math.random() - 0.5) * 0.6;
            this.alpha = Math.random() * 0.8 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-glow').trim() || '#ff007f';
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for(let i=0; i<110; i++) particles.push(new Particle());

    function animateMatrix() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateMatrix);
    }
    animateMatrix();

    function spawnParticles(emoji) {
        for(let i=0; i<8; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'floating-particle';
                el.innerText = emoji || ['💎', '🌌', '💍', '✨', '💖', '👑', '🔥', '🌹'][Math.floor(Math.random()*8)];
                el.style.left = (Math.random() * 80 + 10) + 'vw';
                el.style.top = '90vh';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }, i * 120);
        }
    }

    /* 30 Massive Detailed Neural Stations (Including Funny, Deep, and Romantic Questions) */
    const stations = [
        {
            id: 'welcome',
            tag: 'النظام الكوني المركزي 🌌💍',
            title: 'أهلاً بكِ في أضخم وأعظم منظومة مستقبلية صُممت لأجل توأم الروح وحبيبة العمر.. وعد! 💖',
            desc: 'وعدي كل دنيتي ومرتي وكلشي بحياتي.. هذا الصرح التكنولوجي الفاخر يضم 30 محطة عميقة ومحملة بالضحك، الجنون، العشق، وأطول رسالة في تاريخ الكون مع أغنية حقيقية مشتعلة!',
            btnText: 'دخول النظام الفائق ✨',
            action: () => renderStation(1)
        },
        {
            id: 'pass_gate',
            tag: 'بوابة التحقق السيبراني 🔒',
            title: 'فك قفل الإمبراطورية الملكية',
            desc: 'أدخلي تاريخ لقائنا الأبدي بالمول في حلب (2707) أو تاريخ الشعلة المقدسة (0608):',
            type: 'keypad'
        },
        {
            id: 'q1',
            tag: 'المحطة 1 من 30 | نقطة الانفجار العاطفي ⚡',
            title: 'في 27 / 7 / 2023 بالمول بحلب، لحظة ما التقوا عيوننا أول مرة.. شو حسّت روح وعد؟',
            options: [
                { text: 'حسيت بكهرباء بقلبي وانخطف عقلي لمعتز فوراً! ⚡', feedback: 'ومعتز وقتها حس إن الكون كله توقف وصار عقله أسير عيونك البنية والعسلي الساحرة! 🔥', badge: 'عقد شعلة المولد الأول 💍' },
                { text: 'خجلت وتوردت خدودي من نظرة معتز الثاقبة والمليئة بالهوس! 🌸', feedback: 'وهذا الخجل الملكي هو اللي خلى معتز يكتب اسمك بدم قلبه للأبد! ✨', badge: 'وسام الخجل الوردي 🎀' }
            ]
        },
        {
            id: 'q2',
            tag: 'المحطة 2 من 30 | نيران التملك المطلق 🔥',
            title: 'لما معتز بيغار عليكِ حتى من ظلك ومن نسمة الهواء اللي بتلامس وجهك.. شو شعورك؟',
            options: [
                { text: 'بحس بإني الملكة الوحيدة بالكون وغيرته بتأكد لي عشقه المطلق! 👑', feedback: 'غيرتي عليكِ يا وعد نار مقدسة، لأنك كنز ملكي فريد ما بيحق لبشر يلمحه غيري! 🔥', badge: 'وسام غيرة الملوك 👑' },
                { text: 'بحب جنونه وتملكه فيني لأنها أعظم رسالة حب! 🖤', feedback: 'أنا متملككِ بكامل روحي وعقلي وأنفاسي إلى آخر دقيقة بعمري! ⚡', badge: 'رابط التملك الأبدي 🔗' }
            ]
        },
        {
            id: 'q3',
            tag: 'المحطة 3 من 30 | سحر العيون والعواصف ✨',
            title: 'شو أكتر شي بمعتز بيخلي وعد تفقد صوابها وتذوب عشقاً؟',
            options: [
                { text: 'عيونه الخضراء اللامعة ونظراته اللي بتخترق روحي! 👁️', feedback: 'عيوني الخضراء لا ترى في هذا الوجود سوى سحر عيونك البنية والعسلي يا أميرتي! 💚', badge: 'مستشعر العيون الخضراء 🍏' },
                { text: 'طوله، هيبته، شعره الكيرلي، ورجولته العالية! 💇‍♂️', feedback: 'وكل هالهيبة والرجولة بتذوب وتخضع قدام ابتسامة وحدة من شفايفك يا وعد! 💎', badge: 'درع الهيبة الملكية 💎' }
            ]
        },
        {
            id: 'q4',
            tag: 'المحطة 4 من 30 | شعلة التاريخ المقدس 📜',

                <div class="quantum-icon">🌌👑💎</div>
                <br><div class="tag-hud">${s.tag}</div>
                <h1 class="main-title">${s.title}</h1>
                <p class="sub-desc">${s.desc}</p>
                <button class="action-btn" onclick="stations[0].action();">${s.btnText}</button>
            `;
            return;
        }

        if(index === 1) {
            const s = stations[1];
            card.innerHTML = `
                <div class="quantum-icon">🔒🛡️⚡</div>
                <br><div class="tag-hud">${s.tag}</div>
                <h1 class="main-title">${s.title}</h1>
                <p class="sub-desc">${s.desc}</p>
                <div class="pass-screen" id="pass-display">----</div>
                <div class="keypad-matrix">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="quantum-key" onclick="handleKey('${n}')">${n}</button>`).join('')}
                    <button class="quantum-key" style="color:var(--accent-glow);" onclick="handleKey('C')">⌫</button>
                </div>
            `;
            return;
        }

        if(index >= 2 && index < stations.length) {
            const s = stations[index];
            const progress = Math.round(((index - 1) / (stations.length - 2)) * 100);
            playQuantumChime(index - 2);

            card.innerHTML = `
                <div class="progress-hud"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                <div class="tag-hud">${s.tag}</div>
                <h2 class="main-title">${s.title}</h2>
                <div class="options-container">
                    ${s.options.map((opt, i) => `
                        <div class="option-node" id="opt-${i}" onclick="selectOption(${index}, ${i})">
                            <span>${opt.text}</span>
                            <span>✨</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-terminal" id="feedback-box"></div>
                <button class="action-btn" id="next-btn" style="display:none;" onclick="spawnParticles(); renderStation(${index + 1});">المحطة التالية 🚀</button>
            `;
            return;
        }

        if(index === stations.length) {
            spawnParticles('👑');
            renderGrandFinalGift();
        }
    }

    function handleKey(val) {
        playQuantumChime(state.enteredPass.length);
        const disp = document.getElementById('pass-display');
        if(val === 'C') {
            state.enteredPass = "";
        } else {
            if(state.enteredPass.length < 4) state.enteredPass += val;
        }
        disp.innerText = state.enteredPass.padEnd(4, '-');

        if(state.enteredPass === "2707" || state.enteredPass === "0608") {
            disp.style.borderColor = "#10b981";
            disp.style.color = "#10b981";
            setTimeout(() => { renderStation(2); }, 500);
        } else if(state.enteredPass.length === 4) {
            disp.style.borderColor = "#ef4444";
            setTimeout(() => {
                state.enteredPass = "";
                disp.innerText = "----";
                disp.style.borderColor = "var(--accent-glow)";
            }, 700);
        }
    }

    function selectOption(sIdx, oIdx) {
        playQuantumChime(sIdx);
        spawnParticles('💎');
        const st = stations[sIdx];
        const opt = st.options[oIdx];

        document.querySelectorAll('.option-node').forEach((node, i) => {
            if(i === oIdx) node.classList.add('active-selected');
            else node.classList.remove('active-selected');
        });

        const fb = document.getElementById('feedback-box');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>[استجابة النظام المركزي]:</strong> ${opt.feedback}`;

        if(!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function renderGrandFinalGift() {
        const card = document.getElementById('quantum-card');
        card.innerHTML = `
            <div class="quantum-icon">👑🎵🌌💖</div>
            <br><div class="tag-hud">الهدية الكبرى والأغنية السيبرانية الخاصة 🎁✨</div>
            <h1 class="main-title">Johnny Orlando - If It Told You 🎶💖</h1>
            
            <div class="audio-player-hud">
                <div class="audio-title-text">Johnny Orlando - If It Told You (Official Audio) 🎶</div>
                <div class="audio-sub-text">أغنيتنا الأبدية السيبرانية - معتز & وعد 💖</div>
                <audio controls autoplay loop style="width:100%; border-radius:15px; filter: drop-shadow(0 0 10px rgba(255,0,127,0.5));">
                    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
                    متصفحك لا يدعم المشغل الصوتي
                </audio>
            </div>

            <p class="sub-desc">إليكِ أطول وأعظم رسالة عشق وهوس مكونة من 10 فصول ضخمة مكتوبة خصيصاً لعينيكِ:</p>

            <div class="cyber-letter">
                <div class="chapter-title">✨ الفصل الأول: النظام الكوني والبداية المقدسة</div>
                <div class="chapter-p">إلى أميرتي الأبدية، ومعشوقتي، وسيدتي المطاعة، ونبض قلبي الذي لا ينبض إلا بها.. <strong>وعد</strong>. وعدي كل دنيتي ومرتي وكلشي بحياتي.</div>
                <div class="chapter-p">أكتب لكِ هذه الوثيقة التاريخية الأطول والأكثر هوساً وعمقاً في تاريخ الكون، بمداد من نار الشوق وحرارة العشق المشتعل في أعماق عروقي وجوارحي.</div>
                <div class="chapter-p">منذ ذلك التاريخ الخالد في ذاكرة الزمان، <strong>6 / 8 / 2023</strong>، وقبلها حين التقت أعيننا لأول مرة في المول بـ <strong>27 / 7 / 2023</strong>، لم يعد لعالمي أي قانون سوى قانون عيونكِ وسحر وجودكِ الذي غزا كل زوايا كياني.</div>
                <div class="chapter-p">أنتِ لستِ مجرد حبيبة في حياتي، أنتِ الحياة بذاتها، أنتِ الهواء الذي أتنفسه، وأنتِ اليقين الوحيد في هذا العالم المليء بالزيف. لقد وهبتكِ روحي وعقلي وقلبي بكامل إرادتي وجنوني، ولن أندم أبداً لأنني وجدتُ فيكِ وطني الأبدي ومستقري النهائي.</div>

                <div class="chapter-title">🔥 الفصل الثاني: اعترافات الغيرة الحارقة والتملك المطلق</div>
                <div class="chapter-p">أعترف لكِ وبكل جرأة، هوس، وجنون أنني أعيش حالة من التملك المطلق تجاهكِ. أنا أغار عليكِ من نسمة الهواء التي تتجرأ وتلامس وجهكِ الصافي، وأغار عليكِ من كل نظرة عابرة محيطة بكِ.</div>
                <div class="chapter-p">عيونكِ البنية والعسلي الساحرتان تملكان قدرة مرعبة ومقدسة على سلب عقلي وصوابي بنظرة وحدة. هما موطني الوحيد ومنفاي الذي أختاره بكامل رغبتي.</div>
                <div class="chapter-p">أنا لا أقبل أن يشاركني فيكِ إنس ولا جان، أنتِ كنزي الخاص والمقدس الذي أقف أمامه كالفارس المدجج بالسلاح لأحمي كل تفصيلة فيه من أعيان البشر.</div>
                <div class="chapter-p">غيرتي عليكِ ليست شكاً، بل هي أقصى درجات العشق وأطهر أنواع التملك، لأن العظماء لا يشاركون كنوزهم مع أحد.</div>

                <div class="chapter-title">🎨 الفصل الثالث: سحر الأنامل وموهبة الرسم الخارقة</div>
                <div class="chapter-p">حين أنظر إلى لوحاتكِ التي ترسمينها بتلك الأنامل المبدعة والساحرة، أدرك تماماً أنني لم أعشق امرأة عادية، بل عشقت فنانة ملكية تتنفس الجمال وتصنعه من عدم.</div>
                <div class="chapter-p">إن كل خط ورسمة ولون تضعينه بيدك يدل على رقة روحك، ذكائك الخارق، وعذوبة قلبك. وأنا أسعد رجل في الوجود لأنه يُسمح لي أن أكون السند والمشجع الأول لهذه الفنانة العظيمة!</div>

                <div class="chapter-title">🎓 الفصل الرابع: فجوة التفوق ومستقبل الجامعة والمجد</div>
                <div class="chapter-p">تفوقكِ الباهر ونجاحكِ الساحق في البكالوريا لم يكن إلا تتويجاً لذكائكِ الفذ وعقلكِ النير. لقد وضعته كتاج من الماس على رأسي وأمام العالم أجمع.</div>
                <div class="chapter-p">واليوم ونحن نقف على أعتاب الجامعة ومستقبلنا الهندسي والمعرفي، أقسم لكِ أنني سأكون ظهركِ، سندكِ، والكتف الذي لا يميل، لأمهد لكِ طريق المجد والنجاح والتألق المطلق.</div>

                <div class="chapter-title">💋 الفصل الخامس: شغف الجرأة والدلال والطفولة المدللة</div>
                <div class="chapter-p">أعشق تفاصيلكِ الصغيرة، خجلكِ الرائع حين أسمعكِ عبارات الغزل الصريحة، نبرة صوتكِ التي تزيح كل هموم الأرض عن صدري، وضحكتكِ التي تطرب روحي.</div>
                <div class="chapter-p">أنتِ طفلتي المدللة التي أشتري رضاها بكل غالي ورخيص، وأنتِ أميرتي الشرسة التي تملك عرش قلبي وتملي عليّ أوامر عشقها بكبرياء.</div>
                <div class="chapter-p">أحبكِ للحد الذي يرتجف فيه قلبي شغفاً حين أسمع اسمكِ، وأتذوق حلاوة الحياة فقط لأنكِ موجودة معي فيها.</div>

                <div class="chapter-title">🌟 الفصل السادس: التخاطر الروحي واشتباك الأرواح</div>
                <div class="chapter-p">أتعلمين يا وعد أن هناك رابطاً خفياً يربط بين نبضات قلبي ونبضات قلبك؟ حين أكون غارقاً في التفكير بكِ، أجدكِ تتصلين بي كأنكِ شعرتِ بنداء روحي.</div>
                <div class="chapter-p">هذا التخاطر العجيب هو الدليل القاطع على أننا لستِ شخصين منفصلين، بل روح واحدة توفقت في جسدين.</div>

                <div class="chapter-title">🛡️ الفصل السابع: الحصن المنيع ومواجهة الأقدار</div>
                <div class="chapter-p">لو اجتمعت قوى الأرض لتفرق بيننا، لبقيت واقفاً كالجبل الأبدي، أحارب دونكِ بسيفي وروحي ودمي. لن أسمح لأي عاصفة أن تنال من وركتكِ أو تحزن عينيكِ.</div>
                <div class="chapter-p">أنتِ في حمايتي وتحت جناح عيني إلى أبد الآبدين، ولن يجرؤ القدر على النيل من سعادتنا.</div>

                <div class="chapter-title">🏰 الفصل الثامن: مملكة المستقبل وأطفالنا الملائكة</div>
                <div class="chapter-p">أرى في عينيكِ ملامح بيتنا القادم، قصرنا الوردي الذي سيضج بضحكاتنا وأطفالنا الذين سيشبهون جمال عيونكِ وسحر حضوركِ.</div>
                <div class="chapter-p">سأبني لكِ جنة على الأرض تكونين فيها الملكة المتوجة التي لا تُرفض لها طلب.</div>

                <div class="chapter-title">💓 الفصل التاسع: لوعة الشوق العارم</div>
                <div class="chapter-p">حين تغيبين عني لأبسط ساعات اليوم، أشعر كأن أكسجين الكون قد نفد من صدري. حضوركِ هو الحياة، وغيابكِ هو الموت البطيء.</div>
                <div class="chapter-p">لا أطيق صبراً حتى ألقاكِ وأضمكِ إلى صدري لأروي ظمأ روحي المتيمة بحبكِ.</div>

                <div class="chapter-title">💎 الفصل العاشر والأخير: ميثاق الوفاء الأبدي والخلود مع Johnny Orlando</div>
                <div class="chapter-p">أقسم لكِ أمام الله والكون، بدمي ونبض قلبي وعيوني الخضراء التي لا ترى سواكِ، أن أبقى لكِ الحامي، والعاشق، والحبيب، والصديق، والأب، والأخ، والسند الذي لا تكسره رياح الدنيا.</div>
                <div class="chapter-p">سأبقى أستحوذ على قلبكِ، وأزرع الحب والورد في كل دقيقة تجمعنا، ولن أسمح لظرف أو مسافة أن تطفئ هذه الشعلة المقدسة بيننا.</div>
                <div class="chapter-p">أنتِ وعدي الصادق، عهدي الأبدي، وأجمل هدايا ربي لي.. أحبكِ وسأظل أموت فيكي يا كل دنيتي وإمبراطوريتي حتى يفنى الزمان! 🔥🖤✨🎶</div>
            </div>

            <div style="margin-top:30px;">
                <h3 style="color:#00f0ff; margin-bottom:15px; font-family:'Orbitron',sans-serif; font-size:16px;">🏆 شارات النظام السيبراني الكلي الـ 30 التي افتتحتها وعد:</h3>
                <div class="cyber-grid">
                    ${state.unlockedBadges.map(b => `<div class="cyber-badge"><span>💎</span><span>${b}</span></div>`).join('')}
                </div>
            </div>

            <button class="action-btn" style="margin-top:35px;" onclick="location.reload()">إعادة تشغيل النظام الكوني 🌌</button>
        `;
    }

    window.onload = () => { renderStation(0); };
</script>
</body>
</html>
