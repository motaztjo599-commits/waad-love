<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعيون وعد الأميرة.. لترضا وتبتسم 🌸✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

        :root {
            --bg-light: #fff0f5;
            --card-bg: #ffffff;
            --primary-pink: #ff69b4;
            --deep-pink: #ff1493;
            --text-main: #4a2e35;
            --accent-pink: #ffb6c1;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1, #fff5ee);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #hearts-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid var(--accent-pink);
            border-radius: 35px;
            padding: 40px 30px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.2);
            text-align: center;
            animation: cardEntrance 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-pink), var(--deep-pink));
            color: white;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        h2.question {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .opt-btn {
            background: #fff;
            border: 2px solid #ffd1dc;
            padding: 16px 20px;
            border-radius: 20px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .opt-btn:hover {
            background: #fff0f5;
            border-color: var(--primary-pink);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.25);
        }

        .feedback {
            background: #fff5f8;
            border: 2px dashed var(--primary-pink);
            border-radius: 18px;
            padding: 16px;
            margin-top: 15px;
            font-size: 15px;
            color: #b33965;
            line-height: 1.7;
            display: none;
            font-weight: 700;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--primary-pink), var(--deep-pink));
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        /* حاوية اللعبة السهلة */
        .game-area {
            position: relative;
            height: 250px;
            background: #fff9fb;
            border: 2px dashed var(--accent-pink);
            border-radius: 20px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        .target-heart {
            position: absolute;
            font-size: 38px;
            cursor: pointer;
            transition: transform 0.1s;
            animation: pulseHeart 1s infinite alternate;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .score-board {
            font-size: 16px;
            font-weight: 900;
            color: var(--deep-pink);
            margin-bottom: 10px;
            display: none;
        }

        /* رسالة النهاية */
        .final-box {
            text-align: right;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #fff9fb;
            border-radius: 20px;
            border: 2px solid var(--primary-pink);
            line-height: 2.4;
            font-size: 16px;
            color: var(--text-main);
            display: none;
            scrollbar-width: thin;
        }

        .floating-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 99;
            animation: floatUp 3s ease-out forwards;
            font-size: 24px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.4); }
        }
    </style>
</head>
<body>

<canvas id="hearts-canvas"></canvas>

<div class="card" id="main-card"></div>

<script>
    // تأثيرات القلوب بالخلفية
    const canvas = document.getElementById('hearts-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnEmojis() {
        for(let i=0; i<8; i++) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = ['💖', '🌸', '✨', '🤍', '🌷'][Math.floor(Math.random()*5)];
            el.style.left = (Math.random() * 85 + 5) + 'vw';
            el.style.top = '90vh';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    }

    const steps = [
        {
            badge: "السؤال الأول 🌸",
            title: "لما بتزعلي مني أو بتحסי حالك متضايقة، قديش بيقعد قلبي مرتاح برأيك؟",
            options: [
                { text: 'بيتكدر قلبك وما بتعرف طعم الراحة أبداً لحتى أراضيك! 💔', feedback: 'صدقتِ يا روحي! زعل الدنيا كله يهون إلا زعل عيونك، ما يهون عليّ زعلك أبداً! ✨' },
                { text: 'ببتسم وبتنسى بسرعة! 😌', feedback: 'أنسى؟! مستحيل! دقات قلبي بتتوقف إذا حسيت أنك زعلانة مني لو ثانية وحدة! 🤍' }
            ]
        },
        {
            badge: "السؤال الثاني 👑",
            title: "لو افترضنا صار بيننا نقاش وبأي شكل كان الحق مني أو منك.. شو بيكون موقف معتز؟",
            options: [
                { text: 'براضيك فوراً وبتقول إن غلطك بعيني صواب! 🌹', feedback: 'إي وربي! حتى لو كنتِ أنتِ الغلطانة، غلطك بعيني ألف صواب، وأنا اللي بجي أراضيك! 🥰' },
                { text: 'بتستنى لحتى أنا أراضيك! 😒', feedback: 'أستنى؟! مستحيل أنطر وأنت زعلانة، حتى لو الحق معي، أنا اللي براضيك من عيوني! 💎' }
            ]
        },
        {
            badge: "السؤال الثالث 🌷",
            title: "لما بتدللي عليّ وبتعملي زعلانة بس بدك تتدللي وتأخذي عيون معتز.. شو شعوري؟",
            options: [
                { text: 'بتذوب عشق وبتستسلم لكل دلالك المجنون! 😍', feedback: 'بذوب كلياً! دلالك وعنادك ولطفك ه هنن أجمل شي بعشقي لك يا قلب معتز! 🌸' },
                { text: 'بتتعصب شوي بعدين بتصالحك! 🤭', feedback: 'أنا ما بعصب من تدلل أميرتي، أنا بحطك بعيوني وبجيبلك الدنيا وما فيها لترضي! 💖' }
            ]
        },
        {
            badge: "السؤال الرابع 💍",
            title: "كلمة (بعشقك وراضيك لو زعلت أنا براضيها من عيوني).. شو بتعني لمعتز؟",
            options: [
                { text: 'بأنك أثمن إنسانة ومستعد أعمل المستحيل لتبقى ضحكتك منورة وجهك! ✨', feedback: 'أنتِ مو بس أثمن إنسانة، أنتِ دنيتي ومرتي وكلشي بحياتي يا وعد! ❤️' },
                { text: 'كلمة عادية بتقولها دائماً! 🌸', feedback: 'عادية؟! هاي مو كلمة، هاي عقيدة بقلبي وروحي وبأكدها بكل نبضة! 🔥' }
            ]
        },
        {
            badge: "السؤال الخامس والأخير 🎮",
            title: "تحدي صغير وسهل كتير! لازم تربحي باللعبة هلق لتقدرِ تفتحي رسالة قلبي النهائية.. جاهزة؟",
            options: [
                { text: 'جاهزة اتحداك واربح اللعبة حالاً! 💖', feedback: 'يلا افتحي عيونك وركزي واجمعي 3 قلوب حب لتفتحي الرسالة! 🌸' }
            ]
        }
    ];

    let currentStep = 0;

    function renderStep(idx) {
        currentStep = idx;
        const card = document.getElementById('main-card');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = 'cardEntrance 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

        if(idx < steps.length) {
            const st = steps[idx];
            card.innerHTML = `
                <div class="badge">${st.badge}</div>
                <h2 class="question">${st.title}</h2>
                <div class="options">
                    ${st.options.map((opt, i) => `
                        <div class="opt-btn" onclick="selectOpt(${i})">
                            <span>${opt.text}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback" id="fb-box"></div>
                <button class="next-btn" id="next-btn" onclick="checkNextStage(${idx + 1})">التالي 🌸</button>
            `;
        }
    }

    function selectOpt(i) {
        spawnEmojis();
        const st = steps[currentStep];
        const opt = st.options[i];
        
        const fb = document.getElementById('fb-box');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>[رد معتز]:</strong> ${opt.feedback}`;
        
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function checkNextStage(nextIdx) {
        if(nextIdx === 5) {
            // تشغيل اللعبة السهلة بعد السؤال الخامس
            startMiniGame();
        } else {
            renderStep(nextIdx);
        }
    }

    // لعبة سهلة كتير (اضغط على 3 قلوب)
    let score = 0;
    function startMiniGame() {
        score = 0;
        spawnEmojis();
        const card = document.getElementById('main-card');
        card.innerHTML = `
            <div class="badge">لعبة صلح سريعة وكيوت 🎮💖</div>
            <h2 class="question" style="font-size:18px;">اضغطي على 3 قلوب طايرة لتفتحي رسالة معتز الخاصة!</h2>
            <div class="score-board" id="score-txt">القلوب المجمعة: 0 / 3 🌸</div>
            <div class="game-area" id="game-zone"></div>
        `;
        document.getElementById('score-txt').style.display = 'block';
        document.getElementById('game-zone').style.display = 'block';
        spawnTargetHeart();
    }

    function spawnTargetHeart() {
        const zone = document.getElementById('game-zone');
        if(!zone) return;
        zone.innerHTML = '';

        if(score >= 3) {
            // الفوز باللعبة وإظهار رسالة النهاية
            showFinalLetter();
            return;
        }

        const heart = document.createElement('div');
        heart.className = 'target-heart';
        heart.innerText = ['💖', '🌸', '✨'][Math.floor(Math.random()*3)];
        
        // مكان عشوائي داخل الصندوق
        const maxX = zone.clientWidth - 50;
        const maxY = zone.clientHeight - 50;
        heart.style.left = Math.max(10, Math.floor(Math.random() * maxX)) + 'px';
        heart.style.top = Math.max(10, Math.floor(Math.random() * maxY)) + 'px';

        heart.onclick = () => {
            score++;
            spawnEmojis();
            document.getElementById('score-txt').innerText = `القلوب المجمعة: ${score} / 3 🌸`;
            spawnTargetHeart();
        };

        zone.appendChild(heart);
    }

    function showFinalLetter() {
        spawnEmojis();
        const card = document.getElementById('main-card');
        card.innerHTML = `
            <div class="badge">رسالة الصلح النهائية من عيون معتز 👑💖</div>
            <h2 class="question" style="font-size:20px; color:#db2777;">وعدي.. يا أميرة قلبي وكل دنيتي 🌸</h2>
            
            <div class="final-box" style="display:block;">
                <p>يا قطعة من روحي، ويا أثمن إنسانة بوجودي.. مبارك فوزك باللعبة، بس الأهم إنك ربحتِ قلبي وروحي وكلشي فيه للأبد.</p><br>
                <p>أول شي بدي ياكِ تعرفيه، إنه <strong>ما يهون عليّ زعلesك أبداً</strong>، ولو لحتى رمشة عين. ضحكتك هي اللي بتعطيني الحياة.</p><br>
                <p>وحتّى لو صار وصار شي وكان الحق عليكِ أو عليّ، تذكري دائماً إن <strong>غلطك بعيني صواب ألف مرة</strong>، وما بينقص من غلاوتك عندي أي شي.</p><br>
                <p>أنا <strong>بعشقك</strong>، ولو زعلتِ بيوم، <strong>أنا براضيها من عيوني وببوس قلبك</strong> لحتى ترجعي تبتسمي، لأنك مرتي وعدي الأبدي.</p><br>
                <p style="text-align:center; color:#db2777; font-weight:900; font-size:18px; margin-top:15px;">سامحيني وابتسمي يا أجمل وعد.. بعشقك! 💖✨</p>
            </div>

            <button class="next-btn" style="display:inline-block; margin-top:20px;" onclick="location.reload()">إعادة الموقع من جديد 🔄</button>
        `;
    }

    window.onload = () => {
        renderStep(0);
    };
</script>
</body>
</html>
