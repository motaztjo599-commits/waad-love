<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة العشق والعهد الأسطوري | وعد & معتز 🖤🔥🌸</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&family=Amiri:ital,wght@0,700;1,400&family=Reem+Kufi:wght@700&display=swap');

        :root {
            --primary: #ff0055;
            --secondary: #ff66b2;
            --accent-gold: #ffd700;
            --bg-dark: #070104;
            --card-bg: rgba(20, 4, 13, 0.88);
            --border-glow: rgba(255, 0, 85, 0.5);
            --text-light: #fff0f5;
            --text-gold: #ffe680;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Canvas Particle & Sparkle Background */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Top Bar Indicator */
        .top-nav {
            position: fixed;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .badge-score {
            background: rgba(255, 0, 85, 0.25);
            border: 1px solid var(--primary);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-gold);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .sound-btn:hover {
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transform: scale(1.05);
        }

        /* Main Container */
        .main-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-glow);
            border-radius: 40px;
            padding: 45px 28px;
            max-width: 780px;
            width: 100%;
            backdrop-filter: blur(30px);
            box-shadow: 0 0 70px rgba(255, 0, 85, 0.3), inset 0 0 35px rgba(255, 102, 178, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* Animations & Header */
        .title-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            padding: 7px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); transform: scale(0.98); }
            100% { box-shadow: 0 0 30px rgba(255, 0, 85, 0.9), 0 0 50px rgba(255, 102, 178, 0.7); transform: scale(1.02); }
        }

        .main-heading {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.5;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.7);
        }

        .sub-desc {
            font-size: 16px;
            color: #ffd6e8;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Progress Bar */
        .progress-box {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0055, #ff66b2, #ffd700);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px #ff0055;
        }

        /* Interactive Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 18px 22px;
            border-radius: 22px;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .option-card:hover {
            background: rgba(255, 0, 85, 0.22);
            border-color: var(--primary);
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.35);
        }

        .option-card.selected {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.4), rgba(153, 0, 51, 0.6));
            border-color: var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        .option-text {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            line-height: 1.6;
        }

        .option-icon {
            font-size: 22px;
            margin-left: 12px;
        }

        /* Dynamic Feedback Popup */
        .feedback-box {
            background: rgba(255, 215, 0, 0.09);
            border: 1px dashed var(--accent-gold);
            border-radius: 20px;
            padding: 16px;
            margin-top: 15px;
            font-size: 14.5px;
            color: var(--text-gold);
            line-height: 1.8;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        /* Keypad / Secret Lock Screen */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 20px auto;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-btn:active {
            transform: scale(0.9);
            background: var(--primary);
        }

        .pass-display {
            background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid var(--primary);
            border-radius: 18px;
            padding: 15px;
            font-size: 26px;
            letter-spacing: 10px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        /* Action Buttons */
        .btn-action {
            background: linear-gradient(135deg, #ff0055, #cc0052);
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 50px;
            font-size: 16.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(255, 0, 85, 0.55);
            margin-top: 18px;
            display: inline-block;
        }

        .btn-action:hover {
            transform: scale(1.07);
            box-shadow: 0 12px 40px rgba(255, 0, 85, 0.85);
            background: linear-gradient(135deg, #ff3385, #ff0055);
        }

        /* Letter Styling */
        .letter-container {
            text-align: right;
            max-height: 520px;
            overflow-y: auto;
            padding: 25px 20px;
            background: rgba(10, 2, 7, 0.88);
            border-radius: 25px;
            border: 1px solid rgba(255, 0, 85, 0.45);
            line-height: 2.3;
            font-size: 16px;
            color: #ffe6f0;
            margin-top: 15px;
            scrollbar-width: thin;
            scrollbar-color: #ff0055 rgba(0,0,0,0.5);
        }

        .letter-container::-webkit-scrollbar {
            width: 6px;
        }
        .letter-container::-webkit-scrollbar-thumb {
            background: #ff0055;
            border-radius: 10px;
        }

        .letter-section-title {
            color: var(--accent-gold);
            font-family: 'Amiri', serif;
            font-size: 22px;
            margin: 25px 0 10px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .letter-p {
            margin-bottom: 16px;
            position: relative;
            padding-right: 22px;
        }
        .letter-p::before {
            content: "🔥";
            position: absolute;
            right: 0;
            top: 2px;
            font-size: 12px;
        }

        .letter-highlight {
            background: rgba(255, 0, 85, 0.28);
            padding: 2px 8px;
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        /* Achievements / Badges Display */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .achieve-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Animations */
        .fade-enter {
            animation: fadeEnter 0.6s cubic-bezier(0.39, 0.575, 0.565, 1) forwards;
        }

        @keyframes fadeEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Floating Interactive Elements */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 3.5s ease-out forwards;
            font-size: 26px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-85vh) scale(1.6) rotate(45deg); }
        }

        @media (max-width: 600px) {
            .app-card { padding: 28px 16px; }
            .main-heading { font-size: 20px; }
            .sub-desc { font-size: 14px; }
            .letter-container { font-size: 14.5px; }
            .achievements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="top-nav">
    <div class="badge-score">
        <span>🔥 مقياس العشق والغيرة:</span>
        <span id="love-score">100%</span>
    </div>
    <button class="sound-btn" onclick="toggleAudio()">🔊 المؤثرات: تشغيل</button>
</div>

<div class="main-wrapper">
    <div class="app-card fade-enter" id="main-card">
        <!-- Content injects dynamically -->
    </div>
</div>

<script>
    /* Global State */
    const state = {
        currentStep: 0,
        unlockedBadges: [],
        enteredPass: "",
        soundEnabled: true
    };

    /* Web Audio API Synthesizer - 20 Unique Harmonics */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    // 20 Unique Frequencies for 20 Questions
    const questionFrequencies = [
        261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25,
        587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50,
        1174.66, 1318.51, 1396.91, 1567.98, 1760.00
    ];

    function playSound(type, stepIndex) {
        if (!state.soundEnabled) return;
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'question_tune') {
                const freq = questionFrequencies[stepIndex % 20] || 440;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.12);
                osc.frequency.setValueAtTime(783.99, now + 0.24);
                osc.frequency.setValueAtTime(1046.50, now + 0.36);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'unlock') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.linearRampToValueAtTime(880, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'key') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        } catch(e) { console.log(e); }
    }

    function toggleAudio() {
        state.soundEnabled = !state.soundEnabled;
        const btn = document.querySelector('.sound-btn');
        btn.innerText = state.soundEnabled ? "🔊 المؤثرات: تشغيل" : "🔇 المؤثرات: كتم";
    }

    /* Floating Canvas Sparkles & Particle System */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3.5 + 1;
            this.speedX = (Math.random() - 0.5) * 0.9;
            this.speedY = (Math.random() - 0.5) * 0.9;
            this.color = ['#ff0055', '#ff66b2', '#ffd700', '#ffffff', '#ff99c8'][Math.floor(Math.random() * 5)];
            this.alpha = Math.random() * 0.8 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 85; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function spawnFloatingEmoji(emoji) {
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'floating-heart';
                el.innerText = emoji || ['🔥', '🖤', '👑', '✨', '💋', '🍯', '🌸'][Math.floor(Math.random() * 7)];
                el.style.left = (Math.random() * 80 + 10) + 'vw';
                el.style.top = '90vh';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }, i * 140);
        }
    }

    /* 20 Detailed Questions Data Engine */
    const stagesData = [
        {
            id: 'welcome',
            tag: 'بوابة العشق والتملك المطلق 👑',
            title: 'أهلاً بكِ يا ملكة عرش معتز.. وعد! 🖤🔥',
            desc: 'هذا الموقع هو سيرفر تفاعلي أسطوري ضخم يحتوي على 20 مرحلة من الأسئلة، المؤثرات الصوتية النغمية الخاصة، الأوسمة الملكية، والوثيقة السرية المخبأة خلف قفل الأمان!',
            btnText: 'الدخول إلى خزينة أسرار العشق 🔥',
            action: () => renderStage(1)
        },
        {
            id: 'lock_screen',
            tag: 'نظام الحماية والأمان 🔒',
            title: 'فك قفل السيرفر السري',
            desc: 'للدخول إلى الخزينة، ادخلي رمز تاريخ لقائنا الأول بالمول (2707) أو تاريخ الشعلة (0608):',
            type: 'keypad'
        },
        {
            id: 'q1',
            tag: 'المحطة 1 من 20 | اللقاء الأول 🌟',
            title: 'في 27 / 7 / 2023 بالمول بـ حلب، لما التقت أعيننا لأول مرة.. شو انكتب بقلب وعد؟',
            options: [
                { text: 'شعرت بكهرباء غريبة وانخطف قلبي فوراً لمعتز! ⚡', feedback: 'ومعتز من وقتها انسرق عقله بأول لمحة لعيونك البنية والعسلي الساحرة! 🔥', badge: 'شعلة اللقاء الأول 💍' },
                { text: 'ارتبكت وخجلت من نظرة معتز المليانة هوس! 🙈', feedback: 'وهذا الخجل الملكي خلى معتز يقطع عهد إنك تكوني ملكه وحدك! ✨', badge: 'سحر الخجل الملكي 🌸' }
            ]
        },
        {
            id: 'q2',
            tag: 'المحطة 2 من 20 | نيران الغيرة 🔥',
            title: 'لما معتز بيغار عليكِ من كل النسمات ومن أي نظر عابر.. شو بتحسي؟',
            options: [
                { text: 'بحس بإني الملكة الوحيدة بقلبه وغيرته بتشعل أنوثتي! 💋', feedback: 'غيرتي عليكِ نار حارقة يا وعد، لأنك كنز مقدس ما بيحق لبشر يلمحه غيري! 🔥', badge: 'غيرة الملوك 👑' },
                { text: 'بحب جنونه وتملكه فيني لأنها دليل عشق استثنائي! 🖤', feedback: 'تتملكي روحي وعقلي وأنا بتملك كل تفصيلة فيكي لأخر نفس! ⚡', badge: 'التملك المطلق 🔗' }
            ]
        },
        {
            id: 'q3',
            tag: 'المحطة 3 من 20 | الجمال الملكي ✨',
            title: 'شو أكتر تفصيلة بمعتز بتخلي وعد تذوب عشقاً وتفقد صوابها؟',
            options: [
                { text: 'عيونه الخضراء اللامعة ونظرته المليانة هوس وشغف! 👁️', feedback: 'عيوني الخضراء ما بتشوف بهالدنيا كلها غير سحر عيونك البنية والعسلي! 💚', badge: 'سحر العيون الخضراء 🍏' },
                { text: 'طوله وهيبته وشعره الكيرلي ورجولته العالية! 💇‍♂️', feedback: 'كل هالهيبة والقوة بتخضع قدام ابتسامة وحدة من شفايفك يا وعد! 👑', badge: 'الهيبة والجمال 💎' }
            ]
        },
        {
            id: 'q4',
            tag: 'المحطة 4 من 20 | تاريخ الشعلة 📜',
            title: 'تاريخ 6 / 8 / 2023 بالنسبة لـ معتز ووعد بيمثل شو؟',
            options: [
                { text: 'انفجار شعلة العشق الأبدي والارتباط الروحي المكتوب! 🔥', feedback: 'تاريخ مقدس حفر بقلبي وعقلي، اليوم اللي أعلنت فيه إنك أكسجيني! 🌹', badge: 'العهد الأبدي 6/8 ♾️' },
                { text: 'بدء أعظم حكاية حب وجنون شهدتها حلب والكون! 🏛️', feedback: 'حكايتنا رح يكتبها التاريخ بأحرف من ذهب ونار! ✨', badge: 'الملحمة الحلبية 🏰' }
            ]
        },
        {
            id: 'q5',
            tag: 'المحطة 5 من 20 | أنامل الرسامة 🎨',
            title: 'وعد المبدعة الرسامة.. لما بترسمي لوحاتك البديعة، شو بيخطر ببال معتز؟',

    /* Rendering Engine */
    function renderStage(index) {
        state.currentStep = index;
        const card = document.getElementById('main-card');
        card.className = "app-card fade-enter";
        
        // Welcome
        if (index === 0) {
            const d = stagesData[0];
            card.innerHTML = `
                <div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <button class="btn-action" onclick="playSound('click'); stagesData[0].action();">${d.btnText}</button>
            `;
            return;
        }

        // Keypad Lock
        if (index === 1) {
            const d = stagesData[1];
            card.innerHTML = `
                <div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <div class="pass-display" id="pass-box">----</div>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}
                    <button class="key-btn" style="color:#ff3366;" onclick="pressKey('C')">⌫</button>
                </div>
            `;
            return;
        }

        // 20 Questions Engine
        if (index >= 2 && index < stagesData.length) {
            const d = stagesData[index];
            const progress = Math.round(((index - 1) / (stagesData.length - 2)) * 100);

            // Play unique audio frequency tune for each question
            playSound('question_tune', index - 2);

            card.innerHTML = `
                <div class="progress-box"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                <div class="title-tag">${d.tag}</div>
                <h2 class="main-heading">${d.title}</h2>
                <div class="options-grid">
                    ${d.options.map((opt, i) => `
                        <div class="option-card" id="opt-${i}" onclick="selectOption(${index}, ${i})">
                            <span class="option-text">${opt.text}</span>
                            <span class="option-icon">🔥</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback"></div>
                <button class="btn-action" id="next-btn" style="display:none;" onclick="playSound('click'); spawnFloatingEmoji(); renderStage(${index + 1});">الانتقال للمحطة التالية 🚀</button>
            `;
            return;
        }

        // Final Secret Letter
        if (index === stagesData.length) {
            playSound('success');
            spawnFloatingEmoji('👑');
            renderFinalLetter();
        }
    }

    function pressKey(val) {
        playSound('key');
        const box = document.getElementById('pass-box');
        if (val === 'C') {
            state.enteredPass = "";
        } else {
            if (state.enteredPass.length < 4) state.enteredPass += val;
        }
        box.innerText = state.enteredPass.padEnd(4, '-');

        if (state.enteredPass === "2707" || state.enteredPass === "0608") {
            playSound('unlock');
            box.style.borderColor = "#00ffcc";
            box.style.color = "#00ffcc";
            setTimeout(() => {
                renderStage(2);
            }, 600);
        } else if (state.enteredPass.length === 4) {
            box.style.borderColor = "#ff0055";
            setTimeout(() => {
                state.enteredPass = "";
                box.innerText = "----";
                box.style.borderColor = "var(--primary)";
            }, 800);
        }
    }

    function selectOption(stageIdx, optIdx) {
        playSound('click');
        const stage = stagesData[stageIdx];
        const opt = stage.options[optIdx];

        const cards = document.querySelectorAll('.option-card');
        cards.forEach((c, i) => {
            if (i === optIdx) c.classList.add('selected');
            else c.classList.remove('selected');
        });

        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>تفاعل معتز:</strong> ${opt.feedback}`;

        if (!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }
