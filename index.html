<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة العرش الأبدي | وعد & معتز 🖤👑</title>
    
    <!-- الخطوط والمكتبات الخارجية الاحترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --gold: #f39c12;
            --rose: #ff2a6d;
            --bg-deep: #05020a;
            --card-glass: rgba(18, 10, 26, 0.75);
            --border-glow: rgba(255, 42, 109, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background: var(--bg-deep);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* خلفية الأورورا المتحركة */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 20% 20%, rgba(255, 42, 109, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(243, 156, 18, 0.15), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(100, 0, 50, 0.2), transparent 60%);
            filter: blur(40px);
            z-index: 0;
            animation: auroraMove 10s infinite alternate;
        }

        @keyframes auroraMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(10deg); }
        }

        /* كرت العرض الرئيسي */
        .main-card {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 750px;
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 35px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 42, 109, 0.2);
            transition: all 0.5s ease;
        }

        .crown-badge {
            display: inline-block;
            background: linear-gradient(45deg, var(--rose), var(--gold));
            color: #fff;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 20px;
            box-shadow: 0 0 20px var(--rose);
        }

        .title-text {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 15px var(--rose);
        }

        .desc-text {
            font-size: 16px;
            color: #e0d0e0;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* الخيارات التفاعلية */
        .grid-options {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 18px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-option:hover {
            background: rgba(255, 42, 109, 0.25);
            border-color: var(--rose);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 42, 109, 0.3);
        }

        .btn-action {
            background: linear-gradient(45deg, var(--rose), #b80036);
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 42, 109, 0.5);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 42, 109, 0.8);
        }

        .feedback-card {
            background: rgba(243, 156, 18, 0.1);
            border: 1px dashed var(--gold);
            border-radius: 15px;
            padding: 15px;
            color: var(--gold);
            font-size: 14.5px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="aurora-bg"></div>

<div class="main-card" id="card">
    <div class="crown-badge">بوابة العرش السرمدي 👑</div>
    <h1 class="title-text">أهلاً بكِ يا أميرة معتز.. وعد! 🖤🔥</h1>
    <p class="desc-text">هذا الصرح التفاعلي صُمم بأسلوب سينمائي خاص ليحتفي بعشقنا، بأسرارنا، وبوثيقة العهد الأبدي المخبأة بداخل الخزينة!</p>
    <button class="btn-action" onclick="startJourney()">ابدئي الرحلة الأسطورية ✨</button>
</div>

<script>
    function triggerHearts() {
        confetti({
            particleCount: 40,
            spread: 60,
            origin: { y: 0.8 },
            colors: ['#ff2a6d', '#f39c12', '#ffffff']
        });
    }

    function startJourney() {
        triggerHearts();
        document.getElementById('card').innerHTML = `
            <div class="crown-badge">المحطة الأولى 🌸</div>
            <h2 class="title-text">في 27 / 7 / 2023 بالمول بـ حلب.. شو انكتب بقلب وعد لما التقت عيوننا؟</h2>
            <div class="grid-options">
                <div class="btn-option" onclick="selectOpt('انخطف قلبي فوراً لمعتز وشعرت بكهرباء عجيبة! ⚡')">
                    <span>انخطف قلبي فوراً لمعتز وشعرت بكهرباء عجيبة! ⚡</span>
                    <span>🔥</span>
                </div>
                <div class="btn-option" onclick="selectOpt('خجلت وارتبكت من نظرة معتز المليانة هوس! 🙈')">
                    <span>خجلت وارتبكت من نظرة معتز المليانة هوس! 🙈</span>
                    <span>✨</span>
                </div>
            </div>
            <div class="feedback-card" id="fb"></div>
            <button class="btn-action" id="nextBtn" style="display:none;" onclick="triggerHearts()">المحطة التالية 🚀</button>
        `;
    }

    function selectOpt(text) {
        triggerHearts();
        const fb = document.getElementById('fb');
        fb.style.display = 'block';
        fb.innerHTML = '<strong>تفاعل معتز:</strong> ' + text + ' - ومعتز انسرق عقله فوراً بأول لمحة لعيونك الساحرة البنية والعسلي! 🔥';
        document.getElementById('nextBtn').style.display = 'inline-block';
    }
</script>
</body>
</html>
