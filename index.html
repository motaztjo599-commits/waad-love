<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>I LOVE YOU WAAD</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial, Helvetica, sans-serif;
}


/* =====================================================
   SCENE
===================================================== */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 48%,
            #17100b 0%,
            #090807 25%,
            #020304 65%,
            #000 100%
        );
}


/* =====================================================
   CINEMATIC GLOW
===================================================== */

.light-glow{
    position:absolute;

    left:50%;
    top:32%;

    width:20px;
    height:20px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#ffd68c;

    opacity:0;

    filter:blur(3px);

    box-shadow:
        0 0 20px #ffd68c,
        0 0 60px #ffb84d,
        0 0 130px #ff9d2e,
        0 0 240px rgba(255,140,30,.5);

    transition:
        width 3s ease,
        height 3s ease,
        opacity 3s ease;
}

.scene.lit .light-glow{

    width:650px;
    height:650px;

    opacity:.42;
}


/* =====================================================
   EXTRA WARM LIGHT
===================================================== */

.warm-light{
    position:absolute;

    left:50%;
    top:34%;

    width:500px;
    height:500px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,190,100,.23),
            rgba(255,130,40,.08) 40%,
            transparent 70%
        );

    filter:blur(20px);

    opacity:0;

    transition:opacity 4s ease;
}

.scene.lit .warm-light{
    opacity:1;
}


/* =====================================================
   HANGING CABLES
===================================================== */

.cable{
    position:absolute;

    top:0;

    width:2px;

    background:
        linear-gradient(
            180deg,
            #32343a,
            #111217
        );

    transform-origin:top;

    z-index:4;
}

.cable.one{
    left:22%;
    height:180px;
    transform:rotate(-5deg);
}

.cable.two{
    left:50%;
    height:145px;
}

.cable.three{
    right:22%;
    height:190px;
    transform:rotate(5deg);
}


/* =====================================================
   BULBS
===================================================== */

.bulb{
    position:absolute;

    width:24px;
    height:38px;

    border-radius:
        50% 50% 45% 45%;

    background:#111216;

    border:1px solid #33363d;

    z-index:8;

    transition:
        background 1.8s ease,
        box-shadow 1.8s ease,
        transform 1.8s ease;
}

.bulb::before{
    content:"";

    position:absolute;

    left:5px;
    top:-9px;

    width:12px;
    height:10px;

    border-radius:3px;

    background:#25272d;
}

.bulb.one{
    left:calc(22% - 12px);
    top:168px;
}

.bulb.two{
    left:calc(50% - 12px);
    top:133px;
}

.bulb.three{
    right:calc(22% - 12px);
    top:178px;
}


/* =====================================================
   BULBS ON
===================================================== */

.scene.lit .bulb{

    background:#ffd78f;

    border-color:#fff1ca;

    transform:scale(1.1);

    box-shadow:
        0 0 10px #ffe0a3,
        0 0 30px #ffbd57,
        0 0 70px #ff9e2f,
        0 0 130px rgba(255,150,40,.5);
}


/* =====================================================
   FLOATING DUST
===================================================== */

.dust{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#ffd99b;

    opacity:0;

    animation:
        floatDust 5s infinite ease-in-out;
}

.scene.lit .dust{
    opacity:.5;
}

@keyframes floatDust{

    0%{
        transform:translateY(30px);
        opacity:0;
    }

    30%{
        opacity:.5;
    }

    70%{
        opacity:.35;
    }

    100%{
        transform:translateY(-150px);
        opacity:0;
    }
}


/* =====================================================
   I LOVE YOU
===================================================== */

.love{

    position:absolute;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        scale(.75);

    white-space:nowrap;

    font-size:
        clamp(38px,10vw,82px);

    font-weight:800;

    letter-spacing:4px;

    color:#fff;

    opacity:0;

    filter:
        blur(10px);

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ffd18a,
        0 0 55px #ff9f38,
        0 0 100px rgba(255,150,50,.7);

    transition:
        opacity 2s ease,
        filter 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    z-index:15;
}

.scene.love-show .love{

    opacity:1;

    filter:blur(0);

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =====================================================
   HEART
===================================================== */

.heart{

    position:absolute;

    left:50%;
    top:48%;

    width:90px;
    height:90px;

    transform:
        translate(-50%,-50%)
        scale(0)
        rotate(-10deg);

    opacity:0;

    transition:
        transform 1.7s cubic-bezier(.15,.8,.2,1),
        opacity 1.2s ease;

    z-index:18;
}

.heart::before,
.heart::after{

    content:"";

    position:absolute;

    width:55px;
    height:85px;

    top:0;

    border-radius:
        55px 55px 0 0;

    background:
        linear-gradient(
            180deg,
            #ff9ab8,
            #ff3f78
        );

    box-shadow:
        0 0 15px #ff6b98,
        0 0 40px #ff3d77,
        0 0 90px rgba(255,40,110,.7);
}

.heart::before{

    left:45px;

    transform:
        rotate(45deg);

    transform-origin:
        0 100%;
}

.heart::after{

    left:0;

    transform:
        rotate(-45deg);

    transform-origin:
        100% 100%;
}


/* =====================================================
   HEART SHOW
===================================================== */

.scene.heart-show .heart{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1)
        rotate(0);
}


/* =====================================================
   WAAD
===================================================== */

.waad{

    position:absolute;

    left:50%;
    top:65%;

    transform:
        translate(-50%,-50%)
        translateY(25px);

    opacity:0;

    color:#fff;

    font-size:
        clamp(30px,8vw,60px);

    font-weight:800;

    letter-spacing:10px;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff9ab8,
        0 0 35px #ff4d83,
        0 0 75px #ff316e;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    z-index:20;
}

.scene.heart-show .waad{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}


/* =====================================================
   SMALL PARTICLES
===================================================== */

.particle{

    position:absolute;

    width:2px;
    height:2px;

    background:#fff;

    border-radius:50%;

    opacity:0;

    box-shadow:
        0 0 8px #ffb0c5;

    animation:
        particleMove 4s infinite ease-in-out;
}

.scene.heart-show .particle{
    opacity:.7;
}

@keyframes particleMove{

    0%{
        transform:
            translateY(20px)
            scale(.5);

        opacity:0;
    }

    40%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(-120px)
            scale(1.5);

        opacity:0;
    }
}


/* =====================================================
   VIGNETTE
===================================================== */

.vignette{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.55) 100%
        );

    z-index:50;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .cable.one{
        left:18%;
    }

    .cable.three{
        right:18%;
    }

    .bulb.one{
        left:calc(18% - 12px);
    }

    .bulb.three{
        right:calc(18% - 12px);
    }

    .scene.lit .light-glow{
        width:500px;
        height:500px;
    }

    .love{
        letter-spacing:2px;
    }

    .waad{
        letter-spacing:7px;
    }

}

</style>
</head>

<body>

<div class="scene" id="scene">

    <!-- الإضاءة -->

    <div class="light-glow"></div>

    <div class="warm-light"></div>


    <!-- الأسلاك -->

    <div class="cable one"></div>
    <div class="cable two"></div>
    <div class="cable three"></div>


    <!-- اللمبات -->

    <div class="bulb one"></div>
    <div class="bulb two"></div>
    <div class="bulb three"></div>


    <!-- الجملة -->

    <div class="love">
        I LOVE YOU
    </div>


    <!-- القلب -->

    <div class="heart"></div>


    <!-- الاسم -->

    <div class="waad">
        WAAD
    </div>


    <!-- الغبار الضوئي -->

    <div class="dust" style="left:20%;top:65%;animation-delay:.2s"></div>
    <div class="dust" style="left:30%;top:70%;animation-delay:1s"></div>
    <div class="dust" style="left:40%;top:60%;animation-delay:1.7s"></div>
    <div class="dust" style="left:60%;top:65%;animation-delay:.5s"></div>
    <div class="dust" style="left:70%;top:72%;animation-delay:2s"></div>
    <div class="dust" style="left:80%;top:58%;animation-delay:1.3s"></div>


    <!-- جزيئات -->

    <div class="particle" style="left:25%;top:65%;animation-delay:.5s"></div>
    <div class="particle" style="left:35%;top:70%;animation-delay:1.2s"></div>
    <div class="particle" style="left:48%;top:75%;animation-delay:2s"></div>
    <div class="particle" style="left:65%;top:68%;animation-delay:.8s"></div>
    <div class="particle" style="left:75%;top:72%;animation-delay:1.8s"></div>


    <div class="vignette"></div>

</div>


<script>

const scene = document.getElementById("scene");


/* تشغيل اللمبات */

setTimeout(() => {

    scene.classList.add("lit");

}, 1200);


/* ظهور I LOVE YOU */

setTimeout(() => {

    scene.classList.add("love-show");

}, 3000);


/* اختفاء الجملة وظهور القلب */

setTimeout(() => {

    scene.classList.remove("love-show");

}, 6200);


/* ظهور WAAD والقلب */

setTimeout(() => {

    scene.classList.add("heart-show");

}, 7000);

</script>

</body>
</html>
