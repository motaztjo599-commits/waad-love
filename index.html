<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAAD ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%, #5d124d 0%, #250c2c 28%, #090712 70%, #03030a 100%);
    font-family:"Cairo",sans-serif;
    color:white;
}

/* الخلفية */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;
    animation:moveGlow 8s infinite alternate ease-in-out;
}

.glow.one{
    background:#ff1493;
    top:-150px;
    left:-100px;
}

.glow.two{
    background:#8a2be2;
    bottom:-180px;
    right:-100px;
    animation-delay:2s;
}

.glow.three{
    background:#ff3cac;
    width:300px;
    height:300px;
    top:40%;
    left:45%;
    opacity:.18;
    animation-delay:4s;
}

@keyframes moveGlow{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(70px,40px) scale(1.25);
    }
}

/* النجوم */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* المحتوى */

.container{
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* العنوان */

.title{
    position:absolute;
    top:35px;
    text-align:center;
    z-index:20;
}

.title h1{
    font-size:clamp(28px,7vw,58px);
    font-weight:800;
    letter-spacing:2px;
    background:linear-gradient(
        90deg,
        #fff,
        #ff69b4,
        #ffb6e5,
        #fff
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleGradient 5s linear infinite;
    filter:drop-shadow(0 0 15px rgba(255,20,147,.7));
}

.title p{
    margin-top:5px;
    color:#e8b8da;
    font-size:13px;
    letter-spacing:3px;
}

@keyframes titleGradient{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

/* القلب */

.heart{
    position:relative;
    width:min(90vw,650px);
    height:min(75vw,540px);
    max-height:540px;
    margin-top:30px;
}

/* كلمات وعد */

.word{
    position:absolute;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        scale(var(--scale));
    
    color:#ff69b4;
    font-size:clamp(8px,1.8vw,15px);
    font-weight:700;
    white-space:nowrap;

    text-shadow:
        0 0 4px #ff1493,
        0 0 10px #ff1493,
        0 0 20px rgba(255,20,147,.7);

    animation:
        wordPulse 2.5s infinite ease-in-out;
    
    animation-delay:var(--delay);
}

@keyframes wordPulse{
    0%,100%{
        opacity:.55;
        filter:brightness(.8);
    }

    50%{
        opacity:1;
        filter:brightness(1.6);
    }
}

/* الاسم بالنص */

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:150px;
    height:150px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,105,180,.35),
            rgba(75,10,65,.85) 65%,
            rgba(15,5,20,.95)
        );

    border:2px solid rgba(255,105,180,.8);

    box-shadow:
        0 0 20px #ff1493,
        0 0 50px rgba(255,20,147,.8),
        0 0 100px rgba(255,20,147,.4);

    animation:centerPulse 2.2s infinite ease-in-out;

    z-index:10;
}

.center::before{
    content:"";
    position:absolute;
    inset:-12px;
    border:1px solid rgba(255,105,180,.45);
    border-radius:50%;
    animation:ring 3s infinite linear;
}

.center::after{
    content:"";
    position:absolute;
    inset:-25px;
    border:1px solid rgba(255,105,180,.15);
    border-radius:50%;
    animation:ring 4s infinite linear reverse;
}

.center span{
    font-size:42px;
    font-weight:800;
    color:white;
    text-shadow:
        0 0 10px #ff1493,
        0 0 30px #ff1493,
        0 0 60px #ff1493;
}

@keyframes centerPulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.08);
    }
}

@keyframes ring{
    from{
        transform:rotate(0deg) scale(.95);
        opacity:.3;
    }

    to{
        transform:rotate(360deg) scale(1.1);
        opacity:.8;
    }
}

/* القلوب الطائرة */

.floating-heart{
    position:fixed;
    bottom:-40px;
    color:#ff69b4;
    font-size:18px;
    opacity:0;
    z-index:3;
    animation:floatHeart linear forwards;
    pointer-events:none;
}

@keyframes floatHeart{
    0%{
        transform:translateY(0) scale(.6) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    80%{
        opacity:.7;
    }

    100%{
        transform:
            translateY(-110vh)
            scale(1.5)
            rotate(35deg);
        opacity:0;
    }
}

/* زر الموسيقى */

.music-button{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    z-index:30;

    border:1px solid rgba(255,255,255,.25);

    background:
        linear-gradient(
            135deg,
            rgba(255,20,147,.35),
            rgba(90,20,100,.6)
        );

    color:white;

    padding:12px 25px;

    border-radius:50px;

    font-family:"Cairo",sans-serif;
    font-weight:700;

    cursor:pointer;

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 20px rgba(255,20,147,.35);

    transition:.3s;
}

.music-button:hover{
    transform:translateX(-50%) scale(1.06);
    box-shadow:
        0 0 30px rgba(255,20,147,.7);
}

.music-button.playing{
    background:
        linear-gradient(
            135deg,
            rgba(255,20,147,.75),
            rgba(130,30,150,.8)
        );

    box-shadow:
        0 0 30px #ff1493,
        0 0 60px rgba(255,20,147,.5);
}

/* موبايل */

@media(max-width:600px){

    .title{
        top:25px;
    }

    .title h1{
        font-size:30px;
    }

    .title p{
        font-size:10px;
    }

    .heart{
        width:100vw;
        height:85vw;
        margin-top:40px;
    }

    .word{
        font-size:8px;
    }

    .center{
        width:120px;
        height:120px;
    }

    .center span{
        font-size:32px;
    }

    .music-button{
        bottom:20px;
        font-size:13px;
    }
}

</style>
</head>

<body>

<!-- الخلفية -->

<div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

</div>

<!-- العنوان -->

<div class="container">

    <div class="title">

        <h1>WAAD ❤️</h1>

        <p>A HEART MADE FOR YOU</p>

    </div>

    <!-- القلب -->

    <div class="heart" id="heart">

        <div class="center">

            <span>وعد</span>

        </div>

    </div>

</div>

<!-- زر الموسيقى -->

<button class="music-button" id="musicButton">
    ♫ تشغيل الموسيقى
</button>

<!--
ضع ملف الأغنية الذي تملكه بشكل قانوني
بجانب index.html باسم angel.mp3
-->

<audio id="angelAudio" loop preload="metadata">
    <source src="angel.mp3" type="audio/mpeg">
</audio>

<script>

/* =========================
   إنشاء النجوم
========================= */

for(let i = 0; i < 100; i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    star.style.animationDuration =
        (1.5 + Math.random() * 3) + "s";

    document.querySelector(".background")
        .appendChild(star);
}


/* =========================
   إنشاء القلب
========================= */

const heart = document.getElementById("heart");

const totalWords = 260;

for(let i = 0; i < totalWords; i++){

    const t =
        (Math.PI * 2 * i) /
        totalWords;

    /*
       معادلة القلب
    */

    const x =
        16 * Math.pow(Math.sin(t),3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    /*
       نحول الإحداثيات
       لمكان داخل الصفحة
    */

    const word =
        document.createElement("div");

    word.className = "word";

    word.textContent = "وعد";

    const scaleX = 3.8;
    const scaleY = 3.2;

    word.style.left =
        `calc(50% + ${x * scaleX}px)`;

    word.style.top =
        `calc(50% - ${y * scaleY}px)`;

    word.style.setProperty(
        "--scale",
        0.75 + Math.random() * .5
    );

    word.style.setProperty(
        "--delay",
        Math.random() * 2.5 + "s"
    );

    heart.appendChild(word);
}


/* =========================
   قلوب طائرة
========================= */

function createFloatingHeart(){

    const h =
        document.createElement("div");

    h.className = "floating-heart";

    const hearts = [
        "♥",
        "♡",
        "❤",
        "💗",
        "💖"
    ];

    h.textContent =
        hearts[
            Math.floor(
                Math.random() * hearts.length
            )
        ];

    h.style.left =
        Math.random() * 100 + "vw";

    h.style.fontSize =
        (10 + Math.random() * 25) + "px";

    const duration =
        5 + Math.random() * 7;

    h.style.animationDuration =
        duration + "s";

    document.body.appendChild(h);

    setTimeout(() => {
        h.remove();
    }, duration * 1000);
}

setInterval(
    createFloatingHeart,
    500
);


/* =========================
   الموسيقى
========================= */

const audio =
    document.getElementById("angelAudio");

const musicButton =
    document.getElementById("musicButton");

musicButton.addEventListener(
    "click",
    async () => {

        if(audio.paused){

            try{

                await audio.play();

                musicButton.textContent =
                    "Ⅱ إيقاف الموسيقى";

                musicButton.classList.add(
                    "playing"
                );

            }catch(error){

                alert(
                    "تأكد أن ملف angel.mp3 موجود بجانب index.html"
                );

            }

        }else{

            audio.pause();

            musicButton.textContent =
                "♫ تشغيل الموسيقى";

            musicButton.classList.remove(
                "playing"
            );
        }

    }
);

</script>

</body>
</html>
