<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزينة العهد | معتز & وعد</title>
    <style>
        /* --- التصميم والجماليات (نظام ملكي) --- */
        :root {
            --dark: #0a0a0a;
            --gold: #c5a059;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
            --accent: #b08d44;
        }
        body { margin: 0; background: var(--dark); color: var(--text); font-family: 'Tajawal', sans-serif; overflow: hidden; height: 100vh; }
        
        /* تأثير الجزيئات المتطايرة */
        #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; }

        .app-container { position: relative; z-index: 1; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { 
            background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--gold);
            padding: 50px; border-radius: 30px; box-shadow: 0 0 50px rgba(197, 160, 89, 0.2);
            width: 90%; max-width: 650px; text-align: center; transition: all 0.6s ease-in-out;
        }

        .title { color: var(--gold); font-size: 2.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 5px; }
        .content { font-size: 1.3rem; line-height: 2; margin-bottom: 40px; min-height: 150px; }
        
        input { background: transparent; border: none; border-bottom: 2px solid var(--gold); color: var(--gold); text-align: center; font-size: 1.5rem; width: 80%; padding: 10px; margin-bottom: 20px; outline: none; }
        button { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 15px 40px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: var(--gold); color: var(--dark); }

        .progress { height: 3px; background: #333; margin-bottom: 30px; }
        .progress-bar { height: 100%; background: var(--gold); width: 0%; transition: 0.5s; }

        .hidden { display: none; }
        .fade { animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="app-container">
    <div class="card" id="vault">
        <!-- مرحلة الدخول -->
        <div id="login-screen">
            <h1 class="title">خزينة العهد</h1>
            <p>أدخلي تاريخ بداية حكايتنا (يوم/شهر/سنة) لفك القفل.</p>
            <input type="text" id="pass" placeholder="06/08/2023">
            <br><button onclick="checkPass()">وصول</button>
        </div>

        <!-- مرحلة الأسئلة -->
        <div id="quiz-screen" class="hidden">
            <div class="progress"><div class="progress-bar" id="bar"></div></div>
            <p class="content" id="q-text"></p>
            <button onclick="nextQ()">التالي</button>
        </div>

        <!-- الرسالة النهائية -->
        <div id="letter-screen" class="hidden">
            <div class="content" id="final-letter"></div>
        </div>
    </div>
</div>

<script>
    // نظام الأسئلة الـ 15
    const questions = [
        "1. قبل أن نلتقي في 6 أغسطس، هل كنتِ تشعرين أنكِ تنتظرين شيئاً لا تعرفين ماهيته؟",
        "2. ما هي اللحظة التي شعرتِ فيها أن 'معتز' ليس مجرد شخص عابر، بل هو الوطن؟",
        "3. كيف كانت دقات قلبكِ في اللقاء الأول؟ هل كنتِ تسمعينها أم كنتِ في حالة ذهول؟",
        "4. هل تدركين أنني أرى في عينيكِ مستقبلاً كاملاً، لا مجرد نظرة عابرة؟",
        "5. ما هو العهد الذي تودين أن نجدده كل عام في هذا التاريخ؟",
        "6. عندما نختلف، ما هو الشيء الذي يهدئ روحكِ ويجعلكِ تدركين أننا واحد؟",
        "7. هل ترين أننا تجاوزنا مرحلة 'الحب' إلى مرحلة 'الروح الواحدة'؟",
        "8. ما هو التحدي الذي واجهناه وكاد يكسرنا، لكنه في الحقيقة جعلنا أقوى؟",
        "9. أخبريني، هل تشعرين بأمانٍ في وجودي، أمانٍ لم تجديه مع أي شخص آخر؟",
        "10. كيف تصفين نظرتي إليكِ عندما أكون صامتاً؟ هل تشعرين بالكلام الذي لا أنطقه؟",
        "11. ما هي الصفة التي أحبها فيكِ وتجعلني أتمسك بكِ أكثر كل يوم؟",
        "12. هل تؤمنين أن الأقدار سخرت كوني ليكون محيطاً بكونكِ؟",
        "13. كيف تتخيلين تفاصيل حياتنا بعد أعوام طويلة، حين نكون قد تجاوزنا كل الصعاب؟",
        "14. ما الذي تودين أن تتذكريه دائماً عندما تكونين بعيدة عني؟",
        "15. هل أنتِ جاهزة الآن لفتح وثيقة العهد الأبدي؟"
    ];

    let qIndex = 0;

    function checkPass() {
        const val = document.getElementById('pass').value;
        if(val === "06/08/2023") {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            nextQ();
        } else {
            alert("التاريخ غير صحيح يا وعد.. حاولي مجدداً.");
        }
    }

    function nextQ() {
        if(qIndex < questions.length) {
            const p = document.getElementById('q-text');
            p.innerText = questions[qIndex];
            p.classList.add('fade');
            document.getElementById('bar').style.width = ((qIndex + 1) / questions.length * 100) + "%";
            qIndex++;
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('letter-screen').classList.remove('hidden');
        document.getElementById('final-letter').innerHTML = `
            <h2>وثيقة العهد الأبدي</h2>
            <div style="font-size: 16px; text-align: justify; height: 300px; overflow-y: auto; padding-right: 15px;">
                يا وعد.. يا امتداد روحي وضوء أيامي.<br><br>
                أكتبُ لكِ هذا الميثاق بمدادٍ من صدقِ مشاعري، ليكون شاهداً على ما نحن عليه. منذ ذاك التاريخ، السادس من أغسطس، توقفت عقارب ساعتي عن الدوران بالمعنى التقليدي، وأصبحت أعيشُ في زمنٍ خاصٍ جداً، زمنٍ يُقاس بضحكاتكِ، بنظراتكِ، وبكل تفصيلة صغيرة نتقاسمها.<br><br>
                أنتِ لستِ مجرد حبيبة، أنتِ القوة الخفية التي تدفعني لأكون أعظم. أريدكِ أن تعلمي أنني في كل مرة أرى فيها عينيكِ، أجدُ وطناً لم يسبق لي أن سكنتُ فيه. لقد وهبتكِ قلبي، لا لأنكِ طلبتِ ذلك، بل لأن قلبي لم يجد له مستقراً سواكِ. أنا أعدكِ أمام كل ما نؤمن به، أنني سأكون لكِ السند الذي لا يهتز، والكتف الذي لا يميل.<br><br>
                أعرفُ أن الحياة ليست دائماً سهلة، وأن العواصف قد تأتي، لكنني أقسم أنني سأكون المظلة التي تحميكِ، والقوة التي ترفعكِ كلما تعثرتِ. سأغارُ عليكِ من نسمة الهواء، ليس خوفاً من شيء، بل حباً في أن تكوني ملكي وحدي، كنزاً لا يراه إلا بصري.<br><br>
                أعدكِ أن أحترمكِ، أن أقدركِ، أن أسمعكِ بقلبي قبل أذني، وأن أكون دائماً الشخص الذي يذكره اسمكِ فتبتسمين. أنتِ لستِ خياراً في حياتي، أنتِ الحياة ذاتها.<br><br>
                هذا عهدُ معتز لكِ، عهدٌ لا يقطعه إلا الموت. فكوني كما أنتِ، دائماً قوية، دائماً جميلة، ودائماً لي.<br><br>
                مع كل نبضة.. معتز.
            </div>
        `;
    }

    // كود الجزيئات (Particles) للخلفية
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = [];
    class Particle {
        constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*2; this.speed = Math.random()*0.5; }
        update() { this.y -= this.speed; if(this.y < 0) this.y = canvas.height; }
        draw() { ctx.fillStyle = '#c5a059'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
    }
    for(let i=0; i<100; i++) particles.push(new Particle());
    function animate() { ctx.clearRect(0,0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
    animate();
</script>
</body>
</html>
