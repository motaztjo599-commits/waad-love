    const state = {
        currentStep: 0,
        unlockedBadges: [],
        enteredPass: "",
        soundActive: true
    };

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const zenFrequencies = [
        261.63, 293.66, 329.63, 392.00, 440.00, 
        523.25, 587.33, 659.25, 783.99, 880.00,
        1046.50, 1174.66, 1318.51, 1567.98, 1760.00
    ];

    function playZenChime(index) {
        if (!state.soundActive) return;
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            const freq = zenFrequencies[index % zenFrequencies.length];

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

            osc.start(now);
            osc.stop(now + 0.8);
        } catch(e) { console.log(e); }
    }

    function toggleBackgroundAudio() {
        state.soundActive = !state.soundActive;
        const btn = document.querySelector('.sound-btn');
        btn.innerText = state.soundActive ? "🎵 نغمات هادئة: شغالة" : "🔇 نغمات هادئة: مكتومة";
    }

    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 4 + 1.5;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.speedY = (Math.random() - 0.5) * 0.5;
            this.color = ['#ff758c', '#ff3366', '#ffb3c6', '#ffffff', '#ffd700'][Math.floor(Math.random() * 5)];
            this.alpha = Math.random() * 0.7 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function spawnFloatingEmoji(emoji) {

                setTimeout(() => el.remove(), 3500);

    function renderStage(index) {
        state.currentStep = index;
        const card = document.getElementById('main-card');
        
        if (index === 0) {
            const d = stagesData[0];
            card.innerHTML = `
                <div class="kitty-header-icon">🐱🎀👑</div>
                <br><div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <button class="btn-action" onclick="stagesData[0].action();">${d.btnText}</button>
            `;
            return;
        }

        if (index === 1) {
            const d = stagesData[1];
            card.innerHTML = `
                <div class="kitty-header-icon">🔒🌸👑</div>
                <br><div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <div class="pass-display" id="pass-box">----</div>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}
                    <button class="key-btn" style="color:var(--kitty-red);" onclick="pressKey('C')">⌫</button>
                </div>
            `;
            return;
        }

        if (index >= 2 && index < stagesData.length) {
            const d = stagesData[index];
            const progress = Math.round(((index - 1) / (stagesData.length - 2)) * 100);

            playZenChime(index - 2);

            card.innerHTML = `
                <div class="progress-box"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                <div class="title-tag">${d.tag}</div>
                <h2 class="main-heading">${d.title}</h2>
                <div class="options-grid">
                    ${d.options.map((opt, i) => `
                        <div class="option-card" id="opt-${i}" onclick="selectOption(${index}, ${i})">
                            <span>${opt.text}</span>
                            <span>🎀</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback"></div>
                <button class="btn-action" id="next-btn" style="display:none;" onclick="spawnFloatingEmoji(); renderStage(${index + 1});">المحطة التالية 🌸🚀</button>
            `;
            return;
        }

        if (index === stagesData.length) {
            spawnFloatingEmoji('👑');
            renderFinalGift();
        }
    }

    function pressKey(val) {
        playZenChime(state.enteredPass.length);
        const box = document.getElementById('pass-box');
        if (val === 'C') {
            state.enteredPass = "";
        } else {
            if (state.enteredPass.length < 4) state.enteredPass += val;
        }
        box.innerText = state.enteredPass.padEnd(4, '-');

        if (state.enteredPass === "2707" || state.enteredPass === "0608") {
            box.style.borderColor = "#2a9d8f";
            box.style.color = "#2a9d8f";
            setTimeout(() => {
                renderStage(2);
            }, 500);
        } else if (state.enteredPass.length === 4) {
            box.style.borderColor = "#e63946";
            setTimeout(() => {
                state.enteredPass = "";
                box.innerText = "----";
                box.style.borderColor = "var(--kitty-red)";
            }, 700);
        }
    }

    function selectOption(stageIdx, optIdx) {
        playZenChime(stageIdx);
        const stage = stagesData[stageIdx];
        const opt = stage.options[optIdx];

        const cards = document.querySelectorAll('.option-card');
        cards.forEach((c, i) => {
            if (i === optIdx) c.classList.add('selected');
            else c.classList.remove('selected');
        });

        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>رد معتز المعشوق:</strong> ${opt.feedback}`;

        if (!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }
