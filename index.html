<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيرفر أسرار قلبي - وعد 🎀</title>
    <style>
        :root { --main-bg: #fff5f7; --accent: #ff85a2; --text: #5e4a52; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--main-bg); font-family: 'Segoe UI', cursive; color: var(--text); overflow: hidden; }
        
        /* تأثيرات القلوب */
        .hearts-bg { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .heart-icon { position: absolute; color: #ffc2d1; font-size: 20px; animation: rise 8s infinite linear; }
        @keyframes rise { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 40px; border-radius: 50px; box-shadow: 0 15px 50px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; border: 1px solid #ffe6eb; }
        
        h1 { color: var(--accent); font-size: 28px; margin-bottom: 20px; }
        p { font-size: 20px; line-height: 1.8; margin-bottom: 30px; font-weight: 500; }
        
        button { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 133, 162, 0.3); font-size: 16px; }
        button:hover { transform: translateY(-3px); background: #ff6b91; }

        .letter-box { max-height: 400px; overflow-y: auto; text-align: right; padding: 15px; font-size: 18px; line-height: 2; color: #4a3a41; }
    </style>
</head>
<body>

<div class="hearts-bg" id="hearts"></div>

<div class="container">
    <div class="card" id="card">
        <h1 id="title">أهلاً يا "وعد".. 🌸</h1>
        <p id="desc">هذا المكان صُنع خصيصاً لكِ. هل أنتِ مستعدة لـ 15 خطوة في رحلة حبنا؟</p>
        <button id="action-btn" onclick="nextStep()">أنا مستعدة 💖</button>
    </div>
</div>

<script>
    // إضافة القلوب
    for(let i=0; i<20; i++) {
        const h = document.createElement('div');
        h.className = 'heart-icon'; h.innerHTML = '❤️';
        h.style.left = Math.random() * 100 + '%';
        h.style.animationDelay = Math.random() * 8 + 's';
        document.getElementById('hearts').appendChild(h);
    }

    const steps = [
        "السؤال 1: متذكرة يوم 6/8/2023؟ كيف شعرتِ في تلك اللحظة التي التقت فيها أعيننا لأول مرة؟",
        "السؤال 2: ما هو أكثر شيء في شخصيتي جذبك إليّ من أول لقاء؟",
        "السؤال 3: هل تؤمنين أن الصدفة كانت السبب، أم أنه كان قدراً مكتوباً لنا أن نلتقي؟",
        "السؤال 4: ما هو أكثر موقف أو كلمة قلتها لكِ وما زالت محفورة في ذاكرتك؟",
        "السؤال 5: كيف تصفين شعوركِ عندما يطول غيابنا عن بعضنا؟",
        "السؤال 6: ما هو المكان الذي تحلمين أن نذهب إليه سوياً في المستقبل؟",
        "السؤال 7: هل تشعرين أنني دائماً أحاول أن أكون لكِ السند والأمان؟",
        "السؤال 8: ما هي الصفة التي تحبينها فيّ وتتمنين أن لا تتغير أبداً؟",
        "السؤال 9: هل تدركين حجم الفرحة التي تغمر قلبي بمجرد رؤية رسالة منكِ؟",
        "السؤال 10: ما الذي يجعلكِ تبتسمين تلقائياً عندما تفكرين بي؟",
        "السؤال 11: هل تعتقدين أن حبنا أصبح أقوى وأجمل مع مرور الأيام؟",
        "السؤال 12: ما هو التعهد الذي تريدين مني أن ألتزم به معكِ مدى الحياة؟",
        "السؤال 13: هل تشعرين أننا نكمل بعضنا البعض في كل التفاصيل؟",
        "السؤال 14: أخبريني، ما هو أول شيء يخطر ببالكِ عندما تسمعين اسم 'معتز'؟",
        "السؤال 15: أخيراً.. هل أنتِ مستعدة لاستقبال رسالة قلبي الطويلة والخاصة جداً لكِ؟"
    ];

    let currentStep = 0;

    function nextStep() {
        if (currentStep < steps.length) {
            document.getElementById('title').innerText = "خطوة لقلبك.. 🎀";
            document.getElementById('desc').innerText = steps[currentStep];
            document.getElementById('action-btn').innerText = "التالي 💖";
            currentStep++;
        } else {
            showLoveLetter();
        }
    }

    function showLoveLetter() {
        document.getElementById('title').innerText = "رسالة العشق الأبدي لـ وعد 💌";
        document.getElementById('desc').innerHTML = `
            <div class="letter-box">
                يا نبض معتز، ويا أمانه في هذه الدنيا.. <br><br>
                منذ أن عرفتك في ذلك التاريخ الخالد 6/8/2023، لم يعد الوقت يقاس بالثواني، بل باللحظات التي أعيشها معكِ. أنتِ لستِ مجرد "وعد" في حياتي، أنتِ الوعد الوحيد الذي صدق، وأنتِ الهدية التي أهدتني إياها السماء لتنير عتمة أيامي.<br><br>
                أكتب لكِ اليوم والكلمات تقف عاجزة أمام جمال روحكِ. أريدكِ أن تعرفي أنني في كل صباح أستيقظ فيه، تكونين أنتِ أول ما يخطر ببالي، وفي كل ليلة أنام فيها، تكونين أنتِ آخر ما يغفو عليه قلبي.<br><br>
                لقد علمتني كيف أحب، كيف أهتم، وكيف أكون شخصاً أفضل. أحب فيكِ كل شيء.. بساطتكِ، ذكاءكِ، ضحكتكِ التي ترد لي روحي، وحتى تلك اللحظات التي تخجلين فيها فتزيدينني عشقاً وهوساً بكِ.<br><br>
                أريدكِ أن تعهدي عليّ أمام الكون كله، أنني سأكون لكِ الحصن الذي لا يلين، والكتف الذي لا يميل. سأكون رفيق دربكِ، ومستمعكِ الأول، وصديقكِ الصدوق الذي يفهمكِ من نظرة عينيكِ قبل أن تتكلمي.<br><br>
                لا تظني يوماً أن المسافات أو الظروف ستغير من حبي لكِ ذرة، بل هي وقود يزيدني شوقاً وتعلّقاً بكِ. أنتِ يا وعدي هي أصدق حكاية عشتها، وأجمل خيال تحول إلى واقع ملموس.<br><br>
                أعدكِ أن أحميكِ بقلبي، وأن أرسم السعادة على وجهكِ ما حييت. أنتِ وطني، وأنتِ سكني، وأنتِ الغاية التي أعيش من أجلها. شكراً لأنكِ اخترتِ أن تشاركي حياتكِ معي.<br><br>
                أحبكِ بحجم الكون، وأكثر مما قد تتخيله عقول البشر.. يا أجمل ما حدث لي، يا حبيبتي الأبدية.<br><br>
                - معتز الذي يذوب في تفاصيلك.
            </div>
        `;
        document.getElementById('action-btn').style.display = 'none';
        document.getElementById('card').innerHTML += `<br><button onclick="location.reload()">أعيدي قراءة الحب 🎀</button>`;
    }
</script>
</body>
</html>
