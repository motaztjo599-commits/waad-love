<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>يوسف 😂💩</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 45%,#3b1858 0%,#180d2c 35%,#07050d 75%,#000 100%);
    color:white;
}

/* النجوم */
#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.6);
    }
}

/* المحتوى */
.container{
    position:relative;
    z-index:2;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:25px;
    text-align:center;
}

/* الاسم */
.small{
    font-size:22px;
    color:#d8b8ff;
    margin-bottom:10px;
    text-shadow:0 0 15px #9d4edd;
}

.name{
    font-size:clamp(55px,15vw,110px);
    font-weight:900;

    color:white;

    text-shadow:
        0 0 8px white,
        0 0 20px #c77dff,
        0 0 45px #9d4edd,
        0 0 90px #7b2cbf;

    animation:pulse 2s infinite ease-in-out;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

/* البطاقة */
.card{
    margin-top:35px;

    width:min(850px,94vw);

    padding:45px 20px;

    border-radius:35px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(210,160,255,.45);

    box-shadow:
        0 0 25px rgba(157,78,221,.3),
        0 0 70px rgba(123,44,191,.15),
        inset 0 0 35px rgba(255,255,255,.04);

    backdrop-filter:blur(15px);

    animation:float 4s infinite ease-in-out;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* الإيموجي */
.poop{
    font-size:clamp(65px,18vw,130px);

    filter:
        drop-shadow(0 0 10px #ff9f1c)
        drop-shadow(0 0 30px #ff6d00);

    animation:poop 1.5s infinite ease-in-out;
}

@keyframes poop{
    0%,100%{
        transform:rotate(-5deg) scale(1);
    }
    50%{
        transform:rotate(5deg) scale(1.1);
    }
}

/* النص الأساسي */
.main{
    margin-top:15px;

    font-size:clamp(38px,10vw,80px);
    font-weight:900;

    color:#ffb3ff;

    text-shadow:
        0 0 8px white,
        0 0 18px #ff4dff,
        0 0 40px #c026ff,
        0 0 80px #8a2be2;

    animation:textGlow 2s infinite alternate;
}

@keyframes textGlow{
    from{
        filter:brightness(1);
    }
    to{
        filter:brightness(1.35);
    }
}

/* السطر الثاني */
.sub{
    margin-top:20px;

    font-size:clamp(20px,5vw,32px);
    font-weight:bold;

    color:#eee;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #a855f7;
}

/* زر */
.button{
    margin-top:30px;

    padding:14px 30px;

    border:0;
    border-radius:50px;

    font-size:21px;
    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            90deg,
            #7b2cbf,
            #c026ff,
            #ff4dff
        );

    box-shadow:
        0 0 15px #c026ff,
        0 0 35px rgba(192,38,255,.5);

    animation:buttonGlow 1.8s infinite alternate;
}

@keyframes buttonGlow{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.06);
    }
}

/* إيموجيات طائرة */
.floating{
    position:fixed;
    bottom:-60px;

    font-size:25px;

    z-index:1;

    pointer-events:none;

    animation:rise 6s linear forwards;
}

@keyframes rise{
    0%{
        transform:
            translateY(0)
            rotate(0deg)
            scale(.5);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-110vh)
            rotate(360deg)
            scale(1.5);
        opacity:0;
    }
}

/* موبايل */
@media(max-width:600px){

    .card{
        padding:35px 14px;
    }

    .small{
        font-size:18px;
    }

    .sub{
        line-height:1.5;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container">

    <div class="small">
        🚨 تحذير: يوسف دخل الموقع 🚨
    </div>

    <div class="name">
        يوسف 😂
    </div>

    <div class="card">

        <div class="poop">
            💩
        </div>

        <div class="main">
            جول خرا 😂💩
        </div>

        <div class="sub">
            يوسف الأسطورة 😂🔥
        </div>

        <div class="button">
            💩 جول خرا يا يوسف 😂
        </div>

    </div>

</div>

<script>

/* النجوم */
const stars =
document.getElementById("stars");

for(let i=0;i<120;i++){

    const star =
    document.createElement("div");

    star.className="star";

    star.style.left =
    Math.random()*100+"%";

    star.style.top =
    Math.random()*100+"%";

    star.style.animationDelay =
    Math.random()*3+"s";

    star.style.animationDuration =
    (1.5+Math.random()*3)+"s";

    stars.appendChild(star);
}


/* الإيموجيات الطائرة */
const emojis=[
    "💩",
    "😂",
    "🔥",
    "🤣",
    "💜",
    "✨"
];

function createFloating(){

    const item =
    document.createElement("div");

    item.className="floating";

    item.textContent =
    emojis[
        Math.floor(
            Math.random()*emojis.length
        )
    ];

    item.style.left =
    Math.random()*100+"%";

    item.style.animationDuration =
    (4+Math.random()*4)+"s";

    document.body.appendChild(item);

    setTimeout(()=>{
        item.remove();
    },9000);
}

setInterval(
    createFloating,
    550
);

</script>

</body>
</html>
