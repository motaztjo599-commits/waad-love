<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وعدي كل دنيتي ومرتي وكلشي بحياتي | الإمبراطورية الملكية الأسطورية 🎀🌸💖👑</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:ital,wght@0,700;1,400&family=Reem+Kufi:wght@700&display=swap');

        :root {
            --primary: #ff2a6d;
            --secondary: #05d9e8;
            --accent: #ff007f;
            --card-glass: rgba(20, 10, 30, 0.85);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1b003a 0%, #0d001a 100%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 1.5s ease;
        }

        #universe-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .empire-nav {
            position: fixed;
            top: 15px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(15, 5, 25, 0.75);
            backdrop-filter: blur(20px);
            border: 2px solid var(--primary);
            padding: 12px 25px;
            border-radius: 40px;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.4);
            transition: border-color 1s;
        }

        .empire-title {
            font-size: 15px;
            font-weight: 900;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px var(--secondary);
        }

        .audio-control-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.5);
            transition: transform 0.3s;
        }
        .audio-control-btn:hover {
            transform: scale(1.08);
        }

        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .empire-card {
            background: var(--card-glass);
            border: 3px solid var(--primary);
            border-radius: 45px;
            padding: 45px 35px;
            max-width: 900px;
            width: 100%;
            backdrop-filter: blur(40px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 40px rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: border-color 1s, box-shadow 1s;
        }

        @keyframes cardAnim {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-header {
            font-size: 70px;
            margin-bottom: 15px;
            display: inline-block;
            animation: floatIcon 3s infinite alternate ease-in-out;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0) rotate(0deg) scale(1); filter: drop-shadow(0 0 10px var(--primary)); }
            100% { transform: translateY(-15px) rotate(10deg) scale(1.15); filter: drop-shadow(0 0 25px var(--secondary)); }
        }

        .tag-pill {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 9px 30px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 22px;
            box-shadow: 0 5px 20px rgba(255, 42, 109, 0.5);
            transition: background 1s;
        }

        .heading-main {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 18px;
            line-height: 1.5;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .desc-sub {
            font-size: 17px;
            color: #e2d9f3;
            line-height: 1.9;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%; height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-bottom: 35px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), #ffd700);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--secondary);
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 25px;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 20px 25px;
            border-radius: 25px;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
            font-size: 16.5px;
            font-weight: 700;
            backdrop-filter: blur(10px);
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--secondary);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 30px rgba(5, 217, 232, 0.3);
        }

        .option-item.selected-option {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-color: #ffffff;
            box-shadow: 0 0 35px var(--primary);
            transform: scale(1.02);
        }

        .feedback-terminal {
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed var(--secondary);
            border-radius: 22px;
            padding: 20px;
            margin-top: 20px;
            font-size: 16.5px;
            color: #ffe6f0;
            line-height: 1.8;
            display: none;
            font-weight: 700;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-width: 340px;
            margin: 25px auto;
        }

        .key-pad-btn {
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.2);
            color: var(--secondary);
            font-size: 26px;
            font-weight: 900;
            padding: 18px;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .key-pad-btn:active {
            transform: scale(0.9);
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 25px var(--secondary);
        }

        .pass-screen {
            background: rgba(0,0,0,0.7);
            border: 2px solid var(--secondary);
            border-radius: 20px;
            padding: 18px;
            font-size: 30px;
            letter-spacing: 15px;
            color: var(--secondary);
            margin-bottom: 25px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: inset 0 0 25px rgba(5,217,232,0.3);
        }

        .action-button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 35px rgba(255, 42, 109, 0.5);
            margin-top: 22px;
            display: inline-block;
        }

        .action-button:hover {
            transform: scale(1.06);
            box-shadow: 0 15px 45px rgba(5, 217, 232, 0.8);
        }

        .music-box {
            background: rgba(10, 5, 20, 0.9);
            border: 2.5px solid var(--secondary);
            border-radius: 30px;
            padding: 22px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 35px rgba(5, 217, 232, 0.3);
        }

        .music-title { font-size: 18px; font-weight: 950; color: var(--secondary); }
        .music-sub { font-size: 14px; color: #e2d9f3; font-weight: 700; }

        .letter-scroll-box {
            text-align: right;
            max-height: 600px;
            overflow-y: auto;
            padding: 35px 30px;
            background: rgba(10, 5, 20, 0.95);
            border-radius: 30px;
            border: 2.5px solid var(--primary);
            line-height: 2.8;
            font-size: 18px;
            color: #fce7f3;
            margin-top: 25px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) rgba(0,0,0,0.5);
            box-shadow: inset 0 0 30px rgba(255,42,109,0.2);
        }

        .letter-scroll-box::-webkit-scrollbar { width: 8px; }
        .letter-scroll-box::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .chapter-title-text {
            color: var(--secondary);
            font-family: 'Amiri', serif;
            font-size: 27px;
            margin: 40px 0 18px 0;
            border-bottom: 2px solid rgba(5, 217, 232, 0.4);
            padding-bottom: 8px;
            font-weight: 700;
        }

        .chapter-paragraph {
            margin-bottom: 22px;
            position: relative;
            padding-right: 32px;
            font-weight: 600;
        }
        .chapter-paragraph::before {
            content: "💖";
            position: absolute;
            right: 0; top: 3px;
            font-size: 14px;
        }

        .badges-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 25px;
        }

        .badge-item {
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--secondary);
            border-radius: 20px;
            padding: 15px;
            font-size: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.2);
        }

        .floating-particle-item {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: floatUpParticle 3.5s ease-out forwards;
            font-size: 30px;
        }

        @keyframes floatUpParticle {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.8) rotate(360deg); }
        }

        @media (max-width: 600px) {
            .empire-card { padding: 30px 20px; }
            .heading-main { font-size: 23px; }
            .badges-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<canvas id="universe-canvas"></canvas>

<!-- Background Audio: New Romantic & Magical Sound Track -->
<audio id="master-romantic-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=romantic-guitars-10515.mp3" type="audio/mpeg">
</audio>

<div class="empire-nav">
    <div class="empire-title">
        <span>✨ وعدي كل دنيتي ومرتي وكلشي بحياتي</span>

<div class="main-container">

<script>
    /* Unique Futuristic & Gorgeous Color Palettes for Every Single Station */
    const dynamicThemes = [
        { primary: "#ff2a6d", secondary: "#05d9e8", bg1: "#1b003a", bg2: "#0d001a" },
        { primary: "#7209b7", secondary: "#4cc9f0", bg1: "#110022", bg2: "#050011" },
        { primary: "#f72585", secondary: "#4361ee", bg1: "#220011", bg2: "#110008" },
        { primary: "#06d6a0", secondary: "#118ab2", bg1: "#001a14", bg2: "#000d0a" },
        { primary: "#ff9f1c", secondary: "#2ec4b6", bg1: "#261400", bg2: "#130a00" },
        { primary: "#e71d36", secondary: "#ff9f1c", bg1: "#260005", bg2: "#130002" },
        { primary: "#3a0ca3", secondary: "#4895ef", bg1: "#0a0026", bg2: "#050013" },
        { primary: "#b5179e", secondary: "#f72585", bg1: "#1f001a", bg2: "#0f000d" },
        { primary: "#4cc9f0", secondary: "#7209b7", bg1: "#001522", bg2: "#000a11" },
        { primary: "#ff007f", secondary: "#00f0ff", bg1: "#1a0013", bg2: "#0d0009" }
    ];

    function applyDynamicTheme(idx) {
        const t = dynamicThemes[idx % dynamicThemes.length];
        document.documentElement.style.setProperty('--primary', t.primary);
        document.documentElement.style.setProperty('--secondary', t.secondary);
        document.body.style.background = `radial-gradient(circle at center, ${t.bg1} 0%, ${t.bg2} 100%)`;
        const nav = document.querySelector('.empire-nav');
        if(nav) nav.style.borderColor = t.primary;
    }

    const state = {
        currentStep: 0,
        unlockedBadges: [],
        enteredPass: "",
        audioStarted: false
    };

    function toggleAudioPlayback() {
        const audio = document.getElementById('master-romantic-audio');
        const btn = document.querySelector('.audio-control-btn');
        state.audioStarted = !state.audioStarted;
        if(state.audioStarted) {
            audio.play().then(() => {
                btn.innerText = "🎵 الموسيقى الساحرة: نشطة";
            }).catch(e => {
                alert("اضغط في أي مكان بالشاشة لتفعيل الصوت الكوني!");
            });
        } else {
            audio.pause();
            btn.innerText = "🎵 تشغيل الموسيقى الساحرة";
        }
    }

    /* Web Audio API for Pro Chimes */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function playNoteChime(idx) {
        try {
            if(!audioCtx) audioCtx = new AudioCtx();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(notes[idx % notes.length], now);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } catch(e) {}
    }

    /* Universe Particle Canvas */
    const canvas = document.getElementById('universe-canvas');
    const ctx = canvas.getContext('2d');
    let starList = [];

    function resizeUniverse() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeUniverse);
    resizeUniverse();

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3.5 + 1;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.speedY = (Math.random() - 0.5) * 0.5;
            this.alpha = Math.random() * 0.8 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--secondary').trim() || '#05d9e8';
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for(let i=0; i<120; i++) starList.push(new Star());

    function animateUniverse() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        starList.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animateUniverse);
    }
    animateUniverse();

    function spawnParticles(emoji) {
        for(let i=0; i<8; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'floating-particle-item';
                el.innerText = emoji || ['💖', '✨', '👑', '🌟', '💎', '🌹', '🦋', '💫'][Math.floor(Math.random()*8)];
                el.style.left = (Math.random() * 80 + 10) + 'vw';
                el.style.top = '90vh';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }, i * 120);
        }
    }

    /* 30 Massive Detailed Stations with Funny & Extremely Romantic Questions */

        {

                { text: 'خجلت وتوردت خدودي من نظرة معتز الثاقبة والمليئة بالهوس! 🌸', feedback: 'وهذا الخجل الملكي هو اللي خلى معتز يكتب اسمك بدم قلبه للأبد! ✨', badge: 'وسام الخجل الوردي 🎀' }

            ]
        },
        {

    function renderStation(index) {
        state.currentStep = index;
        applyDynamicTheme(index);
        const card = document.getElementById('empire-card');
        card.style.animation = 'none';
        card.offsetHeight; /* trigger reflow */
        card.style.animation = 'cardAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

        if (index === 0) {
            const st = stationsList[0];
            card.innerHTML = `
                <div class="icon-header">🌌💎👑</div>
                <br><div class="tag-pill">${st.tag}</div>
                <h1 class="heading-main">${st.title}</h1>
                <p class="desc-sub">${st.desc}</p>
                <button class="action-button" onclick="stationsList[0].action();">${st.btnText}</button>
            `;
            return;
        }

        if (index === 1) {
            const st = stationsList[1];
            card.innerHTML = `
                <div class="icon-header">🔒🛡️⚡</div>
                <br><div class="tag-pill">${st.tag}</div>
                <h1 class="heading-main">${st.title}</h1>
                <p class="desc-sub">${st.desc}</p>
                <div class="pass-screen" id="pass-box">----</div>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key-pad-btn" onclick="pressKeypad('${n}')">${n}</button>`).join('')}
                    <button class="key-pad-btn" style="color:var(--primary);" onclick="pressKeypad('C')">⌫</button>
                </div>
            `;
            return;
        }

        if (index >= 2 && index < stationsList.length) {
            const st = stationsList[index];
            const progress = Math.round(((index - 1) / (stationsList.length - 2)) * 100);
            playNoteChime(index - 2);

            card.innerHTML = `
                <div class="progress-bar-container"><div class="progress-bar-fill" style="width: ${progress}%;"></div></div>
                <div class="tag-pill">${st.tag}</div>
                <h2 class="heading-main">${st.title}</h2>
                <div class="options-list">
                    ${st.options.map((opt, i) => `
                        <div class="option-item" id="opt-${i}" onclick="selectOption(${index}, ${i})">
                            <span>${opt.text}</span>
                            <span>✨</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-terminal" id="feedback-term"></div>
                <button class="action-button" id="next-btn" style="display:none;" onclick="spawnParticles(); renderStation(${index + 1});">المحطة التالية 🚀</button>
            `;
            return;
        }

        if (index === stationsList.length) {
            spawnParticles('👑');
            renderGiftBoxScreen();
        }
    }

    function pressKeypad(val) {
        playNoteChime(state.enteredPass.length);
        const box = document.getElementById('pass-box');
        if (val === 'C') {
            state.enteredPass = "";
        } else {
            if (state.enteredPass.length < 4) state.enteredPass += val;
        }
        box.innerText = state.enteredPass.padEnd(4, '-');

        if (state.enteredPass === "2707" || state.enteredPass === "0608") {
            box.style.borderColor = "#06d6a0";
            box.style.color = "#06d6a0";
            setTimeout(() => { renderStation(2); }, 500);
        } else if (state.enteredPass.length === 4) {
            box.style.borderColor = "#e71d36";
            setTimeout(() => {
                state.enteredPass = "";
                box.innerText = "----";
                box.style.borderColor = "var(--secondary)";
            }, 700);
        }
    }

    function selectOption(sIdx, oIdx) {
        playNoteChime(sIdx);
        spawnParticles('💎');
        const st = stationsList[sIdx];
        const opt = st.options[oIdx];

        document.querySelectorAll('.option-item').forEach((node, i) => {
            if (i === oIdx) node.classList.add('selected-option');
            else node.classList.remove('selected-option');
        });

        const fb = document.getElementById('feedback-term');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>[استجابة النظام المركزي]:</strong> ${opt.feedback}`;

        if (!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function renderGiftBoxScreen() {
        applyDynamicTheme(0);
        const card = document.getElementById('empire-card');
        card.innerHTML = `
            <div class="icon-header" id="gift-icon" style="cursor:pointer; font-size:95px;" onclick="handleGiftClick()">🎁</div>
            <br><div class="tag-pill">اضغطي على الهدية الملكية الكبرى! ✨</div>
            <h1 class="heading-main" id="gift-heading">أنتِ على موعد مع المفاجأة الكبرى يا وعد!</h1>
            <p class="desc-sub" id="gift-desc">اضغطي على الهدية بالأعلى واكتشفي ماذا تخبئ لكِ روح معتز...</p>
        `;
    }

    let giftStage = 0;
    function handleGiftClick() {
        playNoteChime(4);
        spawnParticles('💖');
        const icon = document.getElementById('gift-icon');
        const heading = document.getElementById('gift-heading');
        const desc = document.getElementById('gift-desc');

        if (giftStage === 0) {
            // تختفي أول شي
            icon.style.transition = "all 0.5s ease";
            icon.style.transform = "scale(0)";
            icon.style.opacity = "0";
            heading.innerText = "عم امزح هي الهدية! 😂❤️";
            desc.innerText = "اضحكي يلا! جهزي حالك للمفاجأة الحقيقية.. كلي ثقة أنكِ أجمل ضحكة بحياتي.";
            setTimeout(() => {
                icon.innerText = "💝";
                icon.style.transform = "scale(1)";
                icon.style.opacity = "1";
            }, 600);
            giftStage = 1;
        } else if (giftStage === 1) {
            // كبس عااهدية وتفتح الرسالة والأغنية الساحرة
            if(!state.audioStarted) toggleAudioPlayback();
            renderFinalGiftScreen();
        }
    }

    function renderFinalGiftScreen() {
        applyDynamicTheme(0);
        const card = document.getElementById('empire-card');
        card.innerHTML = `
            <div class="icon-header">👑🎵🌌💖</div>
            <br><div class="tag-pill">الهدية الملكية الكبرى والأغنية السحرية الخاصة 🎁✨</div>
            <h1 class="heading-main">أغنية العشق الأبدي والموسيقى الساحرة 🎶💖</h1>
            
            <div class="music-box">
                <div class="music-title">المشغل الموسيقي الكوني - معتز & وعد 🎶</div>
                <div class="music-sub">ألحان هادئة وساحرة تلامس القلوب 💖</div>
                <audio controls autoplay loop style="width:100%; border-radius:15px; filter: drop-shadow(0 0 10px var(--secondary));">
                    <source src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=romantic-guitars-10515.mp3" type="audio/mpeg">
                </audio>
            </div>

            <p class="desc-sub">إليكِ أطول وأعظم رسالة عشق وهوس مكونة من 10 فصول ضخمة مكتوبة خصيصاً لعينيكِ:</p>

            <div class="letter-scroll-box">
                <div class="chapter-title-text">✨ الفصل الأول: الإمبراطورية والبداية المقدسة</div>
                <div class="chapter-paragraph">إلى أميرتي الأبدية، ومعشوقتي، وسيدتي المطاعة، ونبض قلبي الذي لا ينبض إلا بها.. <strong>وعد</strong>. وعدي كل دنيتي ومرتي وكلشي بحياتي.</div>
                <div class="chapter-paragraph">أكتب لكِ هذه الوثيقة التاريخية الأطول والأكثر هوساً وعمقاً في تاريخ الكون، بمداد من نار الشوق وحرارة العشق المشتعل في أعماق عروقي وجوارحي.</div>
                <div class="chapter-paragraph">منذ ذلك التاريخ الخالد في ذاكرة الزمان، <strong>6 / 8 / 2023</strong>، وقبلها حين التقت أعيننا لأول مرة في المول بـ <strong>27 / 7 / 2023</strong>، لم يعد لعالمي أي قانون سوى قانون عيونكِ وسحر وجودكِ الذي غزا كل زوايا كياني.</div>
                <div class="chapter-paragraph">أنتِ لستِ مجرد حبيبة في حياتي، أنتِ الحياة بذاتها، أنتِ الهواء الذي أتنفسه، وأنتِ اليقين الوحيد في هذا العالم المليء بالزيف. لقد وهبتكِ روحي وعقلي وقلبي بكامل إرادتي وجنوني، ولن أندم أبداً لأنني وجدتُ فيكِ وطني الأبدي ومستقري النهائي.</div>

                <div class="chapter-title-text">🔥 الفصل الثاني: اعترافات الغيرة الحارقة والتملك المطلق</div>
                <div class="chapter-paragraph">أعترف لكِ وبكل جرأة، هوس، وجنون أنني أعيش حالة من التملك المطلق تجاهكِ. أنا أغار عليكِ من نسمة الهواء التي تتجرأ وتلامس وجهكِ الصافي، وأغار عليكِ من كل نظرة عابرة محيطة بكِ.</div>
                <div class="chapter-paragraph">عيونكِ البنية والعسلي الساحرتان تملكان قدرة مرعبة ومقدسة على سلب عقلي وصوابي بنظرة وحدة. هما موطني الوحيد ومنفاي الذي أختاره بكامل رغبتي.</div>
                <div class="chapter-paragraph">أنا لا أقبل أن يشاركني فيكِ إنس ولا جان، أنتِ كنزي الخاص والمقدس الذي أقف أمامه كالفارس المدجج بالسلاح لأحمي كل تفصيلة فيه من أعيان البشر.</div>
                <div class="chapter-paragraph">غيرتي عليكِ ليست شكاً، بل هي أقصى درجات العشق وأطهر أنواع التملك، لأن العظماء لا يشاركون كنوزهم مع أحد.</div>

                <div class="chapter-title-text">🎨 الفصل الثالث: سحر الأنامل وموهبة الرسم الخارقة</div>
                <div class="chapter-paragraph">حين أنظر إلى لوحاتكِ التي ترسمينها بتلك الأنامل المبدعة والساحرة، أدرك تماماً أنني لم أعشق امرأة عادية، بل عشقت فنانة ملكية تتنفس الجمال وتصنعه من عدم.</div>
                <div class="chapter-paragraph">إن كل خط ورسمة ولون تضعينه بيدك يدل على رقة روحك، ذكائك الخارق، وعذوبة قلبك. وأنا أسعد رجل في الوجود لأنه يُسمح لي أن أكون السند والمشجع الأول لهذه الفنانة العظيمة!</div>

                <div class="chapter-title-text">🎓 الفصل الرابع: فجوة التفوق ومستقبل الجامعة والمجد</div>
                <div class="chapter-paragraph">تفوقكِ الباهر ونجاحكِ الساحق في البكالوريا لم يكن إلا تتويجاً لذكائكِ الفذ وعقلكِ النير. لقد وضعته كتاج من الماس على رأسي وأمام العالم أجمع.</div>
                <div class="chapter-paragraph">واليوم ونحن نقف على أعتاب الجامعة ومستقبلنا الهندسي والمعرفي، أقسم لكِ أنني سأكون ظهركِ، سندكِ، والكتف الذي لا يميل، لأمهد لكِ طريق المجد والنجاح والتألق المطلق.</div>

                <div class="chapter-title-text">💋 الفصل الخامس: شغف الجرأة والدلال والطفولة المدللة</div>
                <div class="chapter-paragraph">أعشق تفاصيلكِ الصغيرة، خجلكِ الرائع حين أسمعكِ عبارات الغزل الصريحة، نبرة صوتكِ التي تزيح كل هموم الأرض عن صدري، وضحكتكِ التي تطرب روحي.</div>
                <div class="chapter-paragraph">أنتِ طفلتي المدللة التي أشتري رضاها بكل غالي ورخيص، وأنتِ أميرتي الشرسة التي تملك عرش قلبي وتملي عليّ أوامر عشقها بكبرياء.</div>
                <div class="chapter-paragraph">أحبكِ للحد الذي يرتجف فيه قلبي شغفاً حين أسمع اسمكِ، وأتذوق حلاوة الحياة فقط لأنكِ موجودة معي فيها.</div>

                <div class="chapter-title-text">🌟 الفصل السادس: التخاطر الروحي واشتباك الأرواح</div>
                <div class="chapter-paragraph">أتعلمين يا وعد أن هناك رابطاً خفياً يربط بين نبضات قلبي ونبضات قلبك؟ حين أكون غارقاً في التفكير بكِ، أجدكِ تتصلين بي كأنكِ شعرتِ بنداء روحي.</div>
                <div class="chapter-paragraph">هذا التخاطر العجيب هو الدليل القاطع على أننا لستِ شخصين منفصلين، بل روح واحدة توفقت في جسدين.</div>

                <div class="chapter-title-text">🛡️ الفصل السابع: الحصن المنيع ومواجهة الأقدار</div>
                <div class="chapter-paragraph">لو اجتمعت قوى الأرض لتفرق بيننا، لبقيت واقفاً كالجبل الأبدي، أحارب دونكِ بسيفي وروحي ودمي. لن أسمح لأي عاصفة أن تنال من وركتكِ أو تحزن عينيكِ.</div>
                <div class="chapter-paragraph">أنتِ في حمايتي وتحت جناح عيني إلى أبد الآبدين، ولن يجرؤ القدر على النيل من سعادتنا.</div>

                <div class="chapter-title-text">🏰 الفصل الثامن: مملكة المستقبل وأطفالنا الملائكة</div>
                <div class="chapter-paragraph">أرى في عينيكِ ملامح بيتنا القادم، قصرنا الوردي الذي سيضج بضحكاتنا وأطفالنا الذين سيشبهون جمال عيونكِ وسحر حضوركِ.</div>
                <div class="chapter-paragraph">سأبني لكِ جنة على الأرض تكونين فيها الملكة المتوجة التي لا تُرفض لها طلب.</div>

                <div class="chapter-title-text">💓 الفصل التاسع: لوعة الشوق العارم</div>
                <div class="chapter-paragraph">حين تغيبين عني لأبسط ساعات اليوم، أشعر كأن أكسجين الكون قد نفد من صدري. حضوركِ هو الحياة، وغيابكِ هو الموت البطيء.</div>
                <div class="chapter-paragraph">لا أطيق صبراً حتى ألقاكِ وأضمكِ إلى صدري لأروي ظمأ روحي المتيمة بحبكِ.</div>

                <div class="chapter-title-text">💎 الفصل العاشر والأخير: ميثاق الوفاء الأبدي والخلود</div>
                <div class="chapter-paragraph">أقسم لكِ أمام الله والكون، بدمي ونبض قلبي وعيوني الخضراء التي لا ترى سواكِ، أن أبقى لكِ الحامي، والعاشق، والحبيب، والصديق، والأب، والأخ، والسند الذي لا تكسره رياح الدنيا.</div>
                <div class="chapter-paragraph">سأبقى أستحوذ على قلبكِ، وأزرع الحب والورد في كل دقيقة تجمعنا، ولن أسمح لظرف أو مسافة أن تطفئ هذه الشعلة المقدسة بيننا.</div>
                <div class="chapter-paragraph">أنتِ وعدي الصادق، عهدي الأبدي، وأجمل هدايا ربي لي.. أحبكِ وسأظل أموت فيكي يا كل دنيتي وإمبراطوريتي حتى يفنى الزمان! 🔥🖤✨🎶</div>
            </div>

            <div style="margin-top:30px;">
                <h3 style="color:var(--secondary); margin-bottom:15px; font-size:16px;">🏆 شارات الإمبراطورية الكلية الـ 30 التي افتتحتها وعد:</h3>
                <div class="badges-container">
                    ${state.unlockedBadges.map(b => `<div class="badge-item"><span>💎</span><span>${b}</span></div>`).join('')}
                </div>
            </div>

            <button class="action-button" style="margin-top:35px;" onclick="location.reload()">إعادة خوض أعظم ملحمة عشق بالكون 🌌</button>
        `;
    }

    window.onload = () => {
        renderStation(0);
    };
</script>
</body>
</html>
