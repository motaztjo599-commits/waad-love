<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعينيكِ يا وعد.. لترضا أميرتي 🌸👑</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:ital,wght@0,700;1,400&display=swap');

        :root {
            --primary: #ff1493;
            --secondary: #8b008b;
            --accent: #ff69b4;
            --bg-deep: #1a001a;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a001a, #2d0033, #0f001a);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #hearts-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .reconciliation-card {
            position: relative;
            z-index: 10;
            background: rgba(30, 10, 35, 0.9);
            border: 3px solid var(--primary);
            border-radius: 35px;
            padding: 40px 30px;
            max-width: 750px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.4), inset 0 0 30px rgba(255,255,255,0.05);
            text-align: center;
            animation: cardEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .badge-title {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 8px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5);
        }

        .main-question {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 25px;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 105, 180, 0.3);
            padding: 18px 20px;
            border-radius: 20px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }

        .option-btn:hover {
            background: rgba(255, 20, 147, 0.2);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.4);
        }

        .feedback-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed var(--accent);
            border-radius: 18px;
            padding: 18px;
            margin-top: 15px;
            font-size: 16px;
            color: #ffe6f2;
            line-height: 1.8;
            display: none;
            font-weight: 700;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            box-shadow: 0 5px 25px var(--primary);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .final-letter {
            text-align: right;
            max-height: 450px;
            overflow-y: auto;
            padding: 25px;
            background: rgba(20, 5, 25, 0.95);
            border-radius: 25px;
            border: 2px solid var(--primary);
            line-height: 2.6;
            font-size: 17px;
            color: #fce7f3;
            margin-top: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 99;
            animation: floatUp 3s ease-out forwards;
            font-size: 26px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
        }
    </style>
</head>
<body>

<canvas id="hearts-canvas"></canvas>

<div class="reconciliation-card" id="card-box"></div>

<script>
    const canvas = document.getElementById('hearts-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnHearts() {
        for(let i=0; i<10; i++) {
            const el = document.createElement('div');
            el.className = 'floating-heart';
            el.innerText = ['💖', '🌸', '💋', '✨', '❤️'][Math.floor(Math.random()*5)];
            el.style.left = (Math.random() * 80 + 10) + 'vw';
            el.style.top = '85vh';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    }

    const steps = [
        {
            badge: "السؤال الأول 🌸",
            title: "لما بتزعلي مني أو بتحسي حالك زعلانة.. قديش بيقعد قلبي مرتاح برأيك؟",
            options: [
                { text: 'بيتكدر قلبك وما بتعرف طعم الراحة أبداً بعرف يا معتز! 💔', feedback: 'صحيح والله.. زعل الدنيا كله يهون إلا زعل عيونك وعدي، ما يهون عليّ زعلك أبداً! ✨' },
                { text: 'ببتسم وبتنسى بسرعة! 😌', feedback: 'أنسى؟! مستحيل! دقات قلبي بتتوقف إذا حسيت أنك زعلانة مني لوثانية وحدة! 🖤' }
            ]
        },
        {
            badge: "السؤال الثاني 👑",
            title: "لو افترضنا بحالة نادرة صار بيننا شي وصار الحق مني أو منك.. شو بكون موقف معتز؟",
            options: [
                { text: 'براضيك فوراً وبتقول إن غلطك بعيني صواب! 🌹', feedback: 'إي وربي! حتى لو كنت أنتِ الغلطانة، غلطك بعيني ألف صواب، وأنا اللي بجي أراضيك وأبوس عيونك! 😘' },
                { text: 'بتستنى لحتى أنا أراضيك! 😒', feedback: 'أستنى؟! مستحيل أنطر دقيقة وأنت زعلانة، حتى لو الحق معي، أنا اللي براضيك من عيوني! 👑' }
            ]
        },
        {
            badge: "السؤال الثالث 💖",
            title: "لما بتدللي عليّ وبتعملي زعلانة بس بدك تتدللي.. شو شعوري وقتها؟",
            options: [
                { text: 'بتذوب عشق وتستسلم لكل شروط دلالك المجنون! 🥰', feedback: 'بذوب كلياً! دلالك وعنادك ولطفك ه هنن أجمل شي بعشقي لك يا روح قلبي! 🌸' },
                { text: 'بتتعصب شوي بعدين بتصالحك! 🤭', feedback: 'أنا ما بعصب من تدلل أميرتي، أنا بحطك بعيوني وبجيبلك الدنيا وما فيها لترضي! 💎' }
            ]
        },
        {
            badge: "السؤال الرابع 💍",
            title: "كلمة (بعشقك وراضيك لو زعلت أنا براضيها من عيوني).. شو بتعني لمعتز؟",
            options: [
                { text: 'بأنك أثمن إنسانة بالوجود ومستعد أعمل المستحيل لتبقى ضحكتك منورة وجهك! ✨', feedback: 'أنتِ مو بس أثمن إنسانة، أنتِ دنيتي ومرتي وكلشي بحياتي يا وعد! ❤️' },
                { text: 'كلمة عادية بتقولها دائماً! 🌸', feedback: 'عادية؟! هاي مو كلمة، هاي عقيدة بقلبي وروحي وبأكدها بكل نبضة! 🔥' }
            ]
        },
        {
            badge: "السؤال الخامس والأخير 💌",
            title: "جاهزة تسمعي رسالة قلبي النهائية وتسامحي وتفتحي صفحة العشق الصافي؟",
            options: [
                { text: 'جاهزة يا معتز، فرجيني شو مخببي بقلبك! 💖', feedback: 'افتحي قلبك لرسالة معتز اللي كاتبها بدمه وعيونه لأجلك وحدك! 🌹' }
            ]
        }
    ];

    let currentStep = 0;

    function renderStep(idx) {
        currentStep = idx;
        const card = document.getElementById('card-box');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = 'cardEntrance 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

        if(idx < steps.length) {
            const st = steps[idx];
            card.innerHTML = `
                <div class="badge-title">${st.badge}</div>
                <h2 class="main-question">${st.title}</h2>
                <div class="options-container">
                    ${st.options.map((opt, i) => `
                        <div class="option-btn" onclick="selectOpt(${i})">
                            <span>${opt.text}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback-div"></div>
                <button class="next-btn" id="next-s-btn" onclick="renderStep(${idx + 1})">السؤال التالي 🌸</button>
            `;
        } else {
            renderFinalLetter();
        }
    }

    function selectOpt(i) {
        spawnHearts();
        const st = steps[currentStep];
        const opt = st.options[i];
        
        const fb = document.getElementById('feedback-div');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>[رد معتز]:</strong> ${opt.feedback}`;
        
        document.getElementById('next-s-btn').style.display = 'inline-block';
    }

    function renderFinalLetter() {
        spawnHearts();
        const card = document.getElementById('card-box');
        card.innerHTML = `
            <div class="badge-title">رسالة صلح واعتذار من عيون معتز 👑💖</div>
            <h2 class="main-question" style="font-size:22px; color:#ff69b4;">وعدي.. يا كل دنيتي ومرتي وكلشي بحياتي 🌸</h2>
            
            <div class="final-letter">
                <p>يا أميرتي المدللة، وقطعة من روحي.. أكتب لكِ هذه الكلمات وأنا أضع قلبي بين إيديكِ.</p><br>
                <p>أول شي لازم تعرفيه، إنه <strong>ما يهون عليّ زعلesك أبداً</strong>، ولو لفترة ثانية وحدة. بحس الدنيا كلها ضاقت فيني إذا حسيتك متضايقة أو زعلانة مني.</p><br>
                <p>وحتّى لو صار شي وكان الحق عليكِ، تذكري دائماً وبكل يقين إن <strong>غلطك بعيني صواب ألف مرة</strong>، وما بياخد من غلاوتك ولا من مكانتك بقلبي شعرة وحدة.</p><br>
                <p>أنا <strong>بعشقك</strong>، ولو زعلتِ بأي سبب، <strong>أنا براضيها من عيوني وببوس راسك وقلبك</strong> لحتى ترجعي تضحكي، لأن ضحكتك هي اللي بتعطيني الحياة.</p><br>
                <p>حقك عليّ إذا بدر مني أي شي ضايقك، وأنا جاهز أراضي قلبك بكل وسائل الكون، لأنك أنتِ وعدي الأبدي ومرتي وكل دنيتي اللي ما ببدلها بملوك الأرض.</p><br>
                <p style="text-align:center; color:#ff69b4; font-weight:900; font-size:20px; margin-top:15px;">سامحيني، وابتسمي يلا.. بعشقك يا وعد! 💖✨💋</p>
            </div>

            <button class="next-btn" style="display:inline-block; margin-top:20px;" onclick="location.reload()">إعادة الصلح والرسالة من جديد 🔄</button>
        `;
    }

    window.onload = () => {
        renderStep(0);
    };
</script>
</body>
</html>
