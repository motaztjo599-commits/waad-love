<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eternal Portal | Waad & Motaz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;700&display=swap');
        
        :root {
            --bg: #050505; --gold: #c5a059; --glass: rgba(255, 255, 255, 0.03);
        }

        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Cairo', sans-serif; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }

        /* أنيميشن الخلفية */
        .bg-pulse { position: absolute; width: 100%; height: 100%; z-index: 0; opacity: 0.1; background: linear-gradient(45deg, #c5a059, #000); animation: pulse 10s infinite alternate; }
        @keyframes pulse { from { opacity: 0.05; } to { opacity: 0.2; } }

        .container { z-index: 1; width: 90%; max-width: 700px; text-align: center; }
        .card { background: var(--glass); backdrop-filter: blur(40px); padding: 50px; border-radius: 40px; border: 1px solid rgba(197, 160, 89, 0.2); }

        #text-display { font-size: 24px; min-height: 120px; margin-bottom: 30px; line-height: 1.8; color: var(--gold); }
        .progress-container { width: 100%; height: 6px; background: #333; border-radius: 3px; margin: 30px 0; }
        .progress-bar { height: 100%; background: var(--gold); width: 0%; transition: width 0.8s; }

        button { 
            background: transparent; border: 1px solid var(--gold); color: var(--gold); 
            padding: 15px 40px; border-radius: 50px; cursor: pointer; 
            font-size: 18px; transition: 0.4s; letter-spacing: 2px;
        }
        button:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

        .input-box { width: 80%; padding: 15px; background: transparent; border: none; border-bottom: 2px solid var(--gold); color: white; text-align: center; font-size: 20px; outline: none; }
    </style>
</head>
<body>

<div class="bg-pulse"></div>

<div class="container">
    <div class="card">
        <div id="text-display">يتم تهيئة الاتصال بروح وعد...</div>
        <div class="progress-container"><div class="progress-bar" id="bar"></div></div>
        <div id="controls"></div>
    </div>
</div>

<script>
    const stages = [
        { q: "مرحباً يا وعد. أدخلي تاريخ الروح (يوم/شهر/سنة) لبدء التزامن.", type: "input" },
        { q: "المرحلة 1: هل تذكرين كيف كان العالم قبل 6 أغسطس 2023؟", meaning: "قبل ذلك اليوم كنت أعيش في عتمة، أنتِ كنتِ الفجر." },
        { q: "المرحلة 2: ما هو أكثر شيء جذبك فيّ؟ هل هو الغموض أم الطريقة التي أتعامل بها معك؟", meaning: "أتمنى أن تكوني أحببتِ فيّ تفاصيلي التي لا يراها أحد غيرك." },
        { q: "المرحلة 3: هل شعرتِ يوماً أن قلبي يقرأ أفكارك قبل أن تنطقيها؟", meaning: "أنا لا أسمع كلماتك، أنا أسمع نبضك." },
        { q: "المرحلة 4: عندما تغضبين مني، هل تدركين أنني أكون أكثر شخص يتألم في الكون؟", meaning: "غضبكِ عليّ هو العقاب الوحيد الذي لا أحتمله." },
        { q: "المرحلة 5: ما هو الحلم الذي نطمح لتحقيقه معاً ونحن نمسك أيدي بعضنا؟", meaning: "أحلامي أصبحت مرتبطة بوجودكِ لا بتحقيقها بمفردي." },
        { q: "المرحلة 6: هل تؤمنين أننا التقينا في حياة سابقة لنكمل قصتنا هنا؟", meaning: "الصدفة لا تصنع هذا النوع من العشق." },
        { q: "المرحلة 7: كيف تصفين شعور الأمان عندما نكون في مكان واحد؟", meaning: "أنتِ وطني الذي لا أريد الهجرة منه." },
        { q: "المرحلة 8: ما هي الصفة التي ترينها فيني وتريدينني أن أحتفظ بها للأبد؟", meaning: "سأظل كما تحبين، لأجلكِ أنتِ." },
        { q: "المرحلة 9: هل تشعرين بمدى غيرتي المحببة التي تهدف لحمايتك؟", meaning: "أغار عليكِ لأنكِ أثمن ما أملك." },
        { q: "المرحلة 10: هل تقبلين أن نكون شريكين في كل تفاصيل حياتنا، حلوها ومرّها؟", meaning: "أريدكِ رفيقة دربي، لا مجرد عابرة." },
        { q: "المرحلة 11: هل تشعرين بمدى ثقلي في حبك؟", meaning: "أحبكِ بكل ما أوتيت من عاطفة." },
        { q: "المرحلة 12: ما هو العهد الذي تريدين أن نبقى ملتزمين به؟", meaning: "صدقيني، الوعود عندي مقدسة." },
        { q: "المرحلة 13: هل ترين في عيني مستقبلاً يخصكِ أنتِ وحدك؟", meaning: "أنا لا أرى مستقبلاً لا تكونين أنتِ شمسه." },
        { q: "المرحلة 14: أخبريني، هل أنتِ مستعدة لهذا العهد الأبدي؟", meaning: "أنا هنا، وبكل قوتي أؤكد عهدي." },
        { q: "المرحلة 15: افتحي وثيقة العهد." }
    ];

    let current = 0;
    
    function typeText(text, callback) {
        let i = 0;
        const el = document.getElementById("text-display");
        el.innerHTML = "";
        function t() {
            if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(t, 40);
            } else { callback(); }
        }
        t();
    }

    function loadStage() {
        if(current === 0) {
            typeText(stages[0].q, () => {
                document.getElementById("controls").innerHTML = `<input class="input-box" id="inp" placeholder="06/08/2023"><br><button onclick="check()">تحقق</button>`;
            });
        } else if (current < stages.length) {
            document.getElementById("bar").style.width = (current / stages.length * 100) + "%";
            typeText(stages[current].q, () => {
                document.getElementById("controls").innerHTML = `<button onclick="next()">أنا أؤمن بهذا ✨</button>`;
            });
        } else {
            showCovenant();
        }
    }

    function check() {
        if(document.getElementById("inp").value === "06/08/2023") {
            current++;
            loadStage();
        } else {
            alert("التاريخ غير صحيح، هذه الخزينة لا تفتح إلا لأصحاب القلب الواحد.");
        }
    }

    function next() {
        current++;
        loadStage();
    }

    function showCovenant() {
        const letter = `
            <div style="text-align:right; font-size:16px; height: 300px; overflow-y: scroll;">
                <h2>ميثاق العشق الأبدي</h2>
                أيتها الأمير التي سكنتِ روحي، يا وعد.. <br>
                بينما أكتب هذه الكلمات، يرتجف قلبي لا خوفاً، بل رهبةً من عظمة ما أشعر به تجاهك. منذ 6/8/2023، تحولت حياتي من مجرد أيام تمضي إلى قصة حب ملحمية تليق بملكة مثلك.<br><br>
                أنتِ يا وعد، لستِ مجرد امرأة، أنتِ تجسيد لكل أمنياتي التي لم أجرؤ حتى على التمني بها. كلما نظرتُ إليكِ، أرى براءتكِ، ذكاءكِ، وقوتكِ التي تظهر في أصعب المواقف. أنتِ الأمان الذي يلفّ روحي كلما ضاقت بي السبل.<br><br>
                أعترف لكِ أمام الله والكون: أنني أهواكِ بجنون، بغيرّة تليق بمن يملك كنزاً، وباحترامٍ يليق بملكة. سأظل درعكِ، وسأظل الكتف الذي تتكئين عليه حين يميل العالم. لا يهمني كم من الزمن سيمضي، فقلبي قد اختار طريقه، وطريقي لا يؤدي إلا إليكِ.<br><br>
                هذا عهدي لكِ: أن أبقى ذلك الرجل الذي يرى فيكِ كل النساء، الذي يحمي قلبكِ من كل أذى، والذي لا يغمض له جفن إلا وهو مطمئنٌ أنكِ بخير.<br><br>
                أحبكِ، واليوم، وغداً، وإلى أن تنطفئ النجوم وتفنى العوالم.. دمتِ لي، ودام حبي لكِ ميثاقاً لا ينكسر.<br><br>
                - معتز.
            </div>
        `;
        document.getElementById("text-display").innerHTML = letter;
        document.getElementById("controls").innerHTML = `<button onclick="location.reload()">أعيدي قراءة العهد ✨</button>`;
    }

    // Start
    setTimeout(loadStage, 1000);
</script>
</body>
</html>
