    function applyThemeColors(index) {
        const t = colorThemes[index % colorThemes.length];

    function toggleAudioStream() {

    /* Web Audio API for Professional Interactive Chimes */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const zenFrequencies = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function playAudioChime(index) {
        try {
            if(!audioCtx) audioCtx = new AudioCtx();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(zenFrequencies[index % zenFrequencies.length], now);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } catch(e) {}
    }

    /* Dynamic Particle Background Canvas */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 4 + 1.5;
            this.speedX = (Math.random() - 0.5) * 0.6;
            this.speedY = (Math.random() - 0.5) * 0.6;
            this.alpha = Math.random() * 0.8 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim() || '#ff3366';
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for(let i=0; i<110; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function renderStation(index) {
        state.currentStep = index;
        applyThemeColors(index);
        const card = document.getElementById('master-card');
        card.style.animation = 'none';
        card.offsetHeight; /* trigger reflow */
        card.style.animation = 'cardEntrance 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

        if (index === 0) {
            const s = stationsData[0];
            card.innerHTML = `
                <div class="cute-icon">🐱🎀👑</div>
                <br><div class="tag-badge">${s.tag}</div>
                <h1 class="main-heading">${s.title}</h1>
                <p class="sub-desc">${s.desc}</p>
                <button class="action-btn" onclick="stationsData[0].action();">${s.btnText}</button>
            `;
            return;
        }

        if (index === 1) {
            const s = stationsData[1];
            card.innerHTML = `
                <div class="cute-icon">🔒🌸👑</div>
                <br><div class="tag-badge">${s.tag}</div>
                <h1 class="main-heading">${s.title}</h1>
                <p class="sub-desc">${s.desc}</p>
                <div class="pass-display" id="pass-box">----</div>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key-btn" onclick="pressKeypad('${n}')">${n}</button>`).join('')}
                    <button class="key-btn" style="color:var(--theme-color);" onclick="pressKeypad('C')">⌫</button>
                </div>
            `;
            return;
        }

        if (index >= 2 && index < stationsData.length) {
            const s = stationsData[index];
            const progress = Math.round(((index - 1) / (stationsData.length - 2)) * 100);
            playAudioChime(index - 2);

            card.innerHTML = `
                <div class="progress-box"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                <div class="tag-badge">${s.tag}</div>
                <h2 class="main-heading">${s.title}</h2>
                <div class="options-grid">
                    ${s.options.map((opt, i) => `
                        <div class="option-node" id="opt-${i}" onclick="selectOptionNode(${index}, ${i})">
                            <span>${opt.text}</span>
                            <span>🎀</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback-term"></div>
                <button class="action-btn" id="next-station-btn" style="display:none;" onclick="spawnFloatingEmoji(); renderStation(${index + 1});">المحطة التالية 🌸🚀</button>
            `;
            return;
        }

        if (index === stationsData.length) {
            spawnFloatingEmoji('👑');
            renderFinalGiftScreen();
        }
    }

    function pressKeypad(val) {
        playAudioChime(state.enteredPass.length);
        const box = document.getElementById('pass-box');
        if (val === 'C') {
            state.enteredPass = "";
        } else {
            if (state.enteredPass.length < 4) state.enteredPass += val;
        }
        box.innerText = state.enteredPass.padEnd(4, '-');

        if (state.enteredPass === "2707" || state.enteredPass === "0608") {
            box.style.borderColor = "#2a9d8f";
            box.style.color = "#2a9d8f";
            setTimeout(() => { renderStation(2); }, 500);
        } else if (state.enteredPass.length === 4) {
            box.style.borderColor = "#e63946";
            setTimeout(() => {
                state.enteredPass = "";
                box.innerText = "----";
                box.style.borderColor = "var(--theme-color)";
            }, 700);
        }
    }

    function selectOptionNode(sIdx, oIdx) {
        playAudioChime(sIdx);
        spawnFloatingEmoji('✨');
        const st = stationsData[sIdx];
        const opt = st.options[oIdx];

        document.querySelectorAll('.option-node').forEach((node, i) => {
            if (i === oIdx) node.classList.add('selected-node');
            else node.classList.remove('selected-node');
        });

        const fb = document.getElementById('feedback-term');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>رد معتز المعشوق:</strong> ${opt.feedback}`;

        if (!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-station-btn').style.display = 'inline-block';
    }

    function renderFinalGiftScreen() {
        applyThemeColors(0);
        const card = document.getElementById('master-card');
        card.innerHTML = `
            <div class="cute-icon">👑🎀🎵💖</div>
            <br><div class="tag-badge">الهدية الملكية الكبرى والأغنية الخاصة 🎁✨</div>
            <h1 class="main-heading">Johnny Orlando - If It Told You 🎶💖</h1>
            
            <!-- مشغل صوتي مباشر وثابت يعمل بسلاسة تامة -->
            <div class="music-station-box">
                <div class="music-title-text">Johnny Orlando - If It Told You 🎶</div>
                <div class="music-sub-text">أغنيتنا الأبدية - معتز & وعد 💖</div>
                <audio controls autoplay loop style="width:100%; border-radius:15px;">
                    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
                    متصفحك لا يدعم المشغل الصوتي
                </audio>
            </div>

            <p class="sub-desc">إليكِ أطول وأعظم رسالة عشق وهوس مكونة من 10 فصول ضخمة مكتوبة خصيصاً لعينيكِ:</p>

            <div class="letter-container">
                <div class="chapter-header">✨ الفصل الأول: الإمبراطورية والبداية المقدسة</div>
                <div class="chapter-p">إلى أميرتي الأبدية، ومعشوقتي، وسيدتي المطاعة، ونبض قلبي الذي لا ينبض إلا بها.. <strong>وعد</strong>. وعدي كل دنيتي ومرتي وكلشي بحياتي.</div>
                <div class="chapter-p">أكتب لكِ هذه الوثيقة التاريخية الأطول والأكثر هوساً وعمقاً في تاريخ الكون، بمداد من نار الشوق وحرارة العشق المشتعل في أعماق عروقي وجوارحي.</div>
                <div class="chapter-p">منذ ذلك التاريخ الخالد في ذاكرة الزمان، <strong>6 / 8 / 2023</strong>، وقبلها حين التقت أعيننا لأول مرة في المول بـ <strong>27 / 7 / 2023</strong>، لم يعد لعالمي أي قانون سوى قانون عيونكِ وسحر وجودكِ الذي غزا كل زوايا كياني.</div>
                <div class="chapter-p">أنتِ لستِ مجرد حبيبة في حياتي، أنتِ الحياة بذاتها، أنتِ الهواء الذي أتنفسه، وأنتِ اليقين الوحيد في هذا العالم المليء بالزيف. لقد وهبتكِ روحي وعقلي وقلبي بكامل إرادتي وجنوني، ولن أندم أبداً لأنني وجدتُ فيكِ وطني الأبدي ومستقري النهائي.</div>

                <div class="chapter-header">🔥 الفصل الثاني: اعترافات الغيرة الحارقة والتملك المطلق</div>
                <div class="chapter-p">أعترف لكِ وبكل جرأة، هوس، وجنون أنني أعيش حالة من التملك المطلق تجاهكِ. أنا أغار عليكِ من نسمة الهواء التي تتجرأ وتلامس وجهكِ الصافي، وأغار عليكِ من كل نظرة عابرة محيطة بكِ.</div>
                <div class="chapter-p">عيونكِ البنية والعسلي الساحرتان تملكان قدرة مرعبة ومقدسة على سلب عقلي وصوابي بنظرة وحدة. هما موطني الوحيد ومنفاي الذي أختاره بكامل رغبتي.</div>
                <div class="chapter-p">أنا لا أقبل أن يشاركني فيكِ إنس ولا جان، أنتِ كنزي الخاص والمقدس الذي أقف أمامه كالفارس المدجج بالسلاح لأحمي كل تفصيلة فيه من أعيان البشر.</div>
                <div class="chapter-p">غيرتي عليكِ ليست شكاً، بل هي أقصى درجات العشق وأطهر أنواع التملك، لأن العظماء لا يشاركون كنوزهم مع أحد.</div>

                <div class="chapter-header">🎨 الفصل الثالث: سحر الأنامل وموهبة الرسم الخارقة</div>
                <div class="chapter-p">حين أنظر إلى لوحاتكِ التي ترسمينها بتلك الأنامل المبدعة والساحرة، أدرك تماماً أنني لم أعشق امرأة عادية، بل عشقت فنانة ملكية تتنفس الجمال وتصنعه من عدم.</div>
                <div class="chapter-p">إن كل خط ورسمة ولون تضعينه بيدك يدل على رقة روحك، ذكائك الخارق، وعذوبة قلبك. وأنا أسعد رجل في الوجود لأنه يُسمح لي أن أكون السند والمشجع الأول لهذه الفنانة العظيمة!</div>

                <div class="chapter-header">🎓 الفصل الرابع: فجوة التفوق ومستقبل الجامعة والمجد</div>
                <div class="chapter-p">تفوقكِ الباهر ونجاحكِ الساحق في البكالوريا لم يكن إلا تتويجاً لذكائكِ الفذ وعقلكِ النير. لقد وضعته كتاج من الماس على رأسي وأمام العالم أجمع.</div>
                <div class="chapter-p">واليوم ونحن نقف على أعتاب الجامعة ومستقبلنا الهندسي والمعرفي، أقسم لكِ أنني سأكون ظهركِ، سندكِ، والكتف الذي لا يميل، لأمهد لكِ طريق المجد والنجاح والتألق المطلق.</div>

                <div class="chapter-header">💋 الفصل الخامس: شغف الجرأة والدلال والطفولة المدللة</div>
                <div class="chapter-p">أعشق تفاصيلكِ الصغيرة، خجلكِ الرائع حين أسمعكِ عبارات الغزل الصريحة، نبرة صوتكِ التي تزيح كل هموم الأرض عن صدري، وضحكتكِ التي تطرب روحي.</div>
                <div class="chapter-p">أنتِ طفلتي المدللة التي أشتري رضاها بكل غالي ورخيص، وأنتِ أميرتي الشرسة التي تملك عرش قلبي وتملي عليّ أوامر عشقها بكبرياء.</div>
                <div class="chapter-p">أحبكِ للحد الذي يرتجف فيه قلبي شغفاً حين أسمع اسمكِ، وأتذوق حلاوة الحياة فقط لأنكِ موجودة معي فيها.</div>

                <div class="chapter-header">🌟 الفصل السادس: التخاطر الروحي واشتباك الأرواح</div>
                <div class="chapter-p">أتعلمين يا وعد أن هناك رابطاً خفياً يربط بين نبضات قلبي ونبضات قلبك؟ حين أكون غارقاً في التفكير بكِ، أجدكِ تتصلين بي كأنكِ شعرتِ بنداء روحي.</div>
                <div class="chapter-p">هذا التخاطر العجيب هو الدليل القاطع على أننا لستِ شخصين منفصلين، بل روح واحدة توفقت في جسدين.</div>

                <div class="chapter-header">🛡️ الفصل السابع: الحصن المنيع ومواجهة الأقدار</div>
                <div class="chapter-p">لو اجتمعت قوى الأرض لتفرق بيننا، لبقيت واقفاً كالجبل الأبدي، أحارب دونكِ بسيفي وروحي ودمي. لن أسمح لأي عاصفة أن تنال من وركتكِ أو تحزن عينيكِ.</div>
                <div class="chapter-p">أنتِ في حمايتي وتحت جناح عيني إلى أبد الآبدين، ولن يجرؤ القدر على النيل من سعادتنا.</div>

                <div class="chapter-header">🏰 الفصل الثامن: مملكة المستقبل وأطفالنا الملائكة</div>
                <div class="chapter-p">أرى في عينيكِ ملامح بيتنا القادم، قصرنا الوردي الذي سيضج بضحكاتنا وأطفالنا الذين سيشبهون جمال عيونكِ وسحر حضوركِ.</div>
                <div class="chapter-p">سأبني لكِ جنة على الأرض تكونين فيها الملكة المتوجة التي لا تُرفض لها طلب.</div>

                <div class="chapter-header">💓 الفصل التاسع: لوعة الشوق العارم</div>
                <div class="chapter-p">حين تغيبين عني لأبسط ساعات اليوم، أشعر كأن أكسجين الكون قد نفد من صدري. حضوركِ هو الحياة، وغيابكِ هو الموت البطيء.</div>
                <div class="chapter-p">لا أطيق صبراً حتى ألقاكِ وأضمكِ إلى صدري لأروي ظمأ روحي المتيمة بحبكِ.</div>

                <div class="chapter-header">💎 الفصل العاشر والأخير: ميثاق الوفاء الأبدي والخلود مع Johnny Orlando</div>
                <div class="chapter-p">أقسم لكِ أمام الله والكون، بدمي ونبض قلبي وعيوني الخضراء التي لا ترى سواكِ، أن أبقى لكِ الحامي، والعاشق، والحبيب، والصديق، والأب، والأخ، والسند الذي لا تكسره رياح الدنيا.</div>
                <div class="chapter-p">سأبقى أستحوذ على قلبكِ، وأزرع الحب والورد في كل دقيقة تجمعنا، ولن أسمح لظرف أو مسافة أن تطفئ هذه الشعلة المقدسة بيننا.</div>
                <div class="chapter-p">أنتِ وعدي الصادق، عهدي الأبدي، وأجمل هدايا ربي لي.. أحبكِ وسأظل أموت فيكي يا كل دنيتي وإمبراطوريتي حتى يفنى الزمان! 🔥🖤✨🎶</div>
            </div>

            <div style="margin-top:25px;">
                <h3 style="color:var(--theme-color); margin-bottom:12px; font-size:16px;">🏆 الأوسمة الملكية الكبرى الـ 30 التي افتتحتها وعد:</h3>
                <div class="badges-grid">
                    ${state.unlockedBadges.map(b => `<div class="badge-card"><span>🎀</span><span>${b}</span></div>`).join('')}

            </div>

            <button class="action-action action-btn" style="margin-top:25px;" onclick="location.reload()">إعادة خوض أعظم ملحمة عشق بالكون 🌸</button>
        `;
