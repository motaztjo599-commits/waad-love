<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة العشق والجنون | وعد & معتز 🖤🔥🌸</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&family=Amiri:ital,wght@0,700;1,400&display=swap');

        :root {
            --primary: #ff0055;
            --secondary: #ff66b2;
            --accent-gold: #ffd700;
            --bg-dark: #0a0105;
            --card-bg: rgba(22, 5, 14, 0.88);
            --border-glow: rgba(255, 0, 85, 0.4);
            --text-light: #fff0f5;
            --text-gold: #ffe680;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas Particle Background */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Audio Indicator & Controls */
        .top-nav {
            position: fixed;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .badge-score {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid var(--primary);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-gold);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 13px;
            transition: all 0.3s;
        }
        .sound-btn:hover {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Main Container */
        .main-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-glow);
            border-radius: 35px;
            padding: 40px 25px;
            max-width: 750px;
            width: 100%;
            backdrop-filter: blur(25px);
            box-shadow: 0 0 60px rgba(255, 0, 85, 0.25), inset 0 0 30px rgba(255, 102, 178, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* Header Elements */
        .title-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
            100% { box-shadow: 0 0 25px rgba(255, 0, 85, 0.9), 0 0 40px rgba(255, 102, 178, 0.6); }
        }

        .main-heading {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.5;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .sub-desc {
            font-size: 16px;
            color: #ffd6e8;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Progress Bar */
        .progress-box {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0055, #ff66b2, #ffd700);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px #ff0055;
        }

        /* Interactive Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 18px 22px;
            border-radius: 20px;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .option-card:hover {
            background: rgba(255, 0, 85, 0.18);
            border-color: var(--primary);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.3);
        }

        .option-card.selected {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.35), rgba(153, 0, 51, 0.5));
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .option-text {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            line-height: 1.6;
        }

        .option-icon {
            font-size: 20px;
            margin-left: 12px;
        }

        /* Dynamic Feedback Popup */
        .feedback-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px dashed var(--accent-gold);
            border-radius: 18px;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-gold);
            line-height: 1.7;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        /* Keypad / Secret Lock Screen */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 20px auto;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-btn:active {
            transform: scale(0.92);
            background: var(--primary);
        }

        .pass-display {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary);
            border-radius: 15px;
            padding: 15px;
            font-size: 24px;
            letter-spacing: 8px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Action Buttons */
        .btn-action {
            background: linear-gradient(135deg, #ff0055, #cc0052);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.5);
            margin-top: 15px;
            display: inline-block;
        }

        .btn-action:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 35px rgba(255, 0, 85, 0.8);
            background: linear-gradient(135deg, #ff3385, #ff0055);
        }

        /* Letter Styling */
        .letter-container {
            text-align: right;
            max-height: 520px;
            overflow-y: auto;
            padding: 25px 20px;
            background: rgba(10, 2, 7, 0.85);
            border-radius: 25px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            line-height: 2.3;
            font-size: 16px;
            color: #ffe6f0;
            margin-top: 15px;
            scrollbar-width: thin;
            scrollbar-color: #ff0055 rgba(0,0,0,0.5);
        }

        .letter-container::-webkit-scrollbar {
            width: 6px;
        }
        .letter-container::-webkit-scrollbar-thumb {
            background: #ff0055;
            border-radius: 10px;
        }

        .letter-section-title {
            color: var(--accent-gold);
            font-family: 'Amiri', serif;
            font-size: 22px;
            margin: 25px 0 10px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .letter-p {
            margin-bottom: 16px;
            position: relative;
            padding-right: 22px;
        }
        .letter-p::before {
            content: "🔥";
            position: absolute;
            right: 0;
            top: 2px;
            font-size: 12px;
        }

        .letter-highlight {
            background: rgba(255, 0, 85, 0.25);
            padding: 2px 8px;
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        /* Achievements / Badges Display */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .achieve-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Animations */
        .fade-enter {
            animation: fadeEnter 0.6s cubic-bezier(0.39, 0.575, 0.565, 1) forwards;
        }

        @keyframes fadeEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Floating Interactive Elements */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 3.5s ease-out forwards;
            font-size: 24px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-80vh) scale(1.5) rotate(45deg); }
        }

        @media (max-width: 600px) {
            .app-card { padding: 25px 15px; }
            .main-heading { font-size: 20px; }
            .sub-desc { font-size: 14px; }
            .letter-container { font-size: 14.5px; }
            .achievements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<script>
    /* Global Application State */
    const state = {
        currentStep: 0,
        score: 100,
        unlockedBadges: [],
        enteredPass: "",
        soundEnabled: true,
        userChoices: {}
    };

    /* Web Audio API Synthesizer for Immersive Sound Effects */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
        if (!state.soundEnabled) return;
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'unlock') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(900, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'key') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        } catch(e) { console.log(e); }
    }

    function toggleAudio() {
        state.soundEnabled = !state.soundEnabled;
        const btn = document.querySelector('.sound-btn');
        btn.innerText = state.soundEnabled ? "🔊 المؤثرات: تشغيل" : "🔇 المؤثرات: كتم";
    }

    /* Floating Particles System */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 0.8;
            this.speedY = (Math.random() - 0.5) * 0.8;
            this.color = ['#ff0055', '#ff66b2', '#ffd700', '#ffffff'][Math.floor(Math.random() * 4)];
            this.alpha = Math.random() * 0.7 + 0.3;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function spawnFloatingEmoji(emoji) {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'floating-heart';
                el.innerText = emoji || ['🔥', '🖤', '👑', '✨', '💋', '🍯'][Math.floor(Math.random() * 6)];

                el.style.top = '90vh';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }, i * 150);
        }
    }

    /* Rendering Logic */
    function renderStage(index) {
        state.currentStep = index;
        const card = document.getElementById('main-card');
        card.className = "app-card fade-enter";
        
        // Handle Welcome Stage
        if (index === 0) {
            const d = stagesData[0];
            card.innerHTML = `
                <div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <button class="btn-action" onclick="playSound('click'); stagesData[0].action();">${d.btnText}</button>
            `;
            return;
        }

        // Handle Keypad Stage (Security Lock)
        if (index === 1) {
            const d = stagesData[1];
            card.innerHTML = `
                <div class="title-tag">${d.tag}</div>
                <h1 class="main-heading">${d.title}</h1>
                <p class="sub-desc">${d.desc}</p>
                <div class="pass-display" id="pass-box">----</div>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}
                    <button class="key-btn" style="color:#ff3366;" onclick="pressKey('C')">⌫</button>
                </div>
            `;
            return;
        }

        // Handle Questions Stage
        if (index >= 2 && index < stagesData.length) {
            const d = stagesData[index];
            const progress = Math.round(((index - 1) / (stagesData.length - 2)) * 100);

            card.innerHTML = `
                <div class="progress-box"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                <div class="title-tag">${d.tag}</div>
                <h2 class="main-heading">${d.title}</h2>
                <div class="options-grid">
                    ${d.options.map((opt, i) => `
                        <div class="option-card" id="opt-${i}" onclick="selectOption(${index}, ${i})">
                            <span class="option-text">${opt.text}</span>
                            <span class="option-icon">🔥</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-box" id="feedback"></div>
                <button class="btn-action" id="next-btn" style="display:none;" onclick="playSound('click'); spawnFloatingEmoji(); renderStage(${index + 1});">الانتقال للمحطة التالية 🚀</button>
            `;
            return;
        }

        // Handle Final Secret Letter Stage
        if (index === stagesData.length) {
            playSound('success');
            spawnFloatingEmoji('👑');
            renderFinalLetter();
        }
    }

    function pressKey(val) {
        playSound('key');
        const box = document.getElementById('pass-box');
        if (val === 'C') {
            state.enteredPass = "";
        } else {
            if (state.enteredPass.length < 4) state.enteredPass += val;
        }
        box.innerText = state.enteredPass.padEnd(4, '-');

        if (state.enteredPass === "2707" || state.enteredPass === "0608") {
            playSound('unlock');
            box.style.borderColor = "#00ffcc";
            box.style.color = "#00ffcc";
            setTimeout(() => {
                renderStage(2);
            }, 600);
        } else if (state.enteredPass.length === 4) {
            box.style.borderColor = "#ff0055";
            setTimeout(() => {
                state.enteredPass = "";
                box.innerText = "----";
                box.style.borderColor = "var(--primary)";
            }, 800);
        }
    }

    function selectOption(stageIdx, optIdx) {
        playSound('click');
        const stage = stagesData[stageIdx];
        const opt = stage.options[optIdx];

        // Highlight selected
        const cards = document.querySelectorAll('.option-card');
        cards.forEach((c, i) => {
            if (i === optIdx) c.classList.add('selected');
            else c.classList.remove('selected');
        });

        // Show feedback & update score
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>تفاعل معتز:</strong> ${opt.feedback}`;

        if (!state.unlockedBadges.includes(opt.badge)) {
            state.unlockedBadges.push(opt.badge);
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }
