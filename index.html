<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>رؤى أحلى بوو بالمجرة</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    overflow-x:hidden;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:white;

    background:
    radial-gradient(
        circle at 50% 10%,
        #3d174b 0%,
        #1b0b27 25%,
        #08050d 65%,
        #000 100%
    );
}


/* =========================
   GALAXY
========================= */

.galaxy{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}


.star{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 7px white;

    animation:
        twinkle
        2s
        infinite
        ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.2;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =========================
   CONTAINER
========================= */

.container{

    position:relative;

    width:100%;

    max-width:950px;

    margin:auto;

    padding:
        35px 18px 70px;

    text-align:center;

    z-index:2;
}


/* =========================
   TITLE
========================= */

.small-title{

    color:#ffb8d4;

    font-size:
        clamp(17px,4vw,25px);

    margin-bottom:5px;

    letter-spacing:1px;
}


.title{

    font-size:
        clamp(36px,9vw,70px);

    font-weight:900;

    line-height:1.15;

    color:white;

    text-shadow:

        0 0 8px #ffbad7,
        0 0 20px #ff6da7,
        0 0 45px #ff287c;

    animation:
        titlePulse
        2.5s
        ease-in-out
        infinite;
}

@keyframes titlePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.035);
    }
}


.description{

    margin-top:10px;

    color:#ffd4e4;

    font-size:
        clamp(17px,4vw,25px);
}


/* =========================
   PHOTOS AREA
========================= */

.cards{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:22px;

    margin-top:32px;

    flex-wrap:wrap;
}


.card{

    position:relative;

    width:
        min(410px,92vw);

    padding:10px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,173,207,.45);

    box-shadow:

        0 0 25px
        rgba(255,60,140,.2),

        inset 0 0 25px
        rgba(255,255,255,.035);

    backdrop-filter:
        blur(12px);

    animation:
        floating 4s
        ease-in-out
        infinite;
}

.card:nth-child(2){
    animation-delay:-2s;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}


/* =========================
   ROUA IMAGE
========================= */

.roua-image{

    width:100%;

    height:390px;

    object-fit:cover;

    border-radius:23px;

    display:block;

    box-shadow:
        0 0 25px
        rgba(255,90,155,.3);
}


.card-name{

    padding:
        14px 5px 8px;

    font-size:25px;

    font-weight:900;

    color:#ffd5e5;

    text-shadow:
        0 0 12px #ff5d9d;
}


/* =========================
   POU CARD
========================= */

.pou-area{

    height:390px;

    border-radius:23px;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            #ffbd9b 0%,
            #b96865 38%,
            #50283d 70%,
            #160c1d 100%
        );
}


/* =========================
   POU
========================= */

.pou{

    position:relative;

    width:210px;

    height:240px;

    animation:
        pouBounce
        1.8s
        ease-in-out
        infinite;
}


@keyframes pouBounce{

    0%,100%{
        transform:translateY(0)
        rotate(0deg);
    }

    50%{
        transform:translateY(-12px)
        rotate(2deg);
    }
}


/* جسم بو */

.pou-body{

    position:absolute;

    left:20px;

    bottom:0;

    width:170px;

    height:190px;

    background:

        radial-gradient(
            circle at 40% 30%,
            #e0a37f,
            #a95d57 65%,
            #6d3b43 100%
        );

    border-radius:
        48%
        48%
        43%
        43%;

    box-shadow:

        inset
        -15px
        -20px
        30px
        rgba(60,20,30,.35),

        0 15px 30px
        rgba(0,0,0,.45);
}


/* العين */

.eye{

    position:absolute;

    top:66px;

    width:23px;
    height:29px;

    background:#18131b;

    border-radius:50%;

    box-shadow:
        inset 5px 5px 0
        rgba(255,255,255,.75);

    z-index:3;
}

.eye.left{
    left:63px;
}

.eye.right{
    right:63px;
}


/* الفم */

.mouth{

    position:absolute;

    left:50%;

    top:111px;

    transform:
        translateX(-50%);

    width:48px;
    height:24px;

    border-bottom:
        5px solid #3b1c2a;

    border-radius:
        0 0 50px 50px;
}


/* الحاجبين */

.brow{

    position:absolute;

    top:55px;

    width:38px;

    height:6px;

    border-radius:10px;

    background:#63333a;

}

.brow.left{

    left:51px;

    transform:
        rotate(-10deg);
}

.brow.right{

    right:51px;

    transform:
        rotate(10deg);
}


/* القبعة الصغيرة */

.pou-heart{

    position:absolute;

    top:22px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:38px;

    z-index:5;

    filter:
        drop-shadow(
            0 0 10px
            #ff6c9e
        );
}


/* =========================
   MAIN MESSAGE
========================= */

.message{

    position:relative;

    margin-top:35px;

    padding:
        28px 15px 32px;

    border-radius:32px;

    background:

        linear-gradient(
            135deg,
            rgba(255,76,145,.16),
            rgba(130,70,255,.12)
        );

    border:
        1px solid
        rgba(255,170,205,.35);

    box-shadow:

        0 0 35px
        rgba(255,50,130,.18),

        inset 0 0 30px
        rgba(255,255,255,.025);
}


.main-message{

    font-size:
        clamp(27px,7vw,52px);

    font-weight:900;

    line-height:1.35;

    color:white;

    text-shadow:

        0 0 8px white,
        0 0 20px #ff7eaf,
        0 0 45px #ff2478;
}


.main-message span{

    color:#ff9fc3;

}


/* =========================
   SIMILARITY
========================= */

.similarity{

    margin-top:20px;

    font-size:
        clamp(21px,5vw,34px);

    font-weight:900;

    color:#ffe0eb;

    text-shadow:
        0 0 10px #ff70a5;
}


.laugh{

    display:inline-block;

    animation:
        laugh
        1s
        infinite
        alternate;
}

@keyframes laugh{

    from{
        transform:rotate(-6deg);
    }

    to{
        transform:rotate(6deg);
    }
}


/* =========================
   FINAL TEXT
========================= */

.final{

    margin-top:20px;

    font-size:
        clamp(31px,8vw,58px);

    font-weight:900;

    color:#ff9fc3;

    text-shadow:

        0 0 8px #ffb5d0,
        0 0 25px #ff4f91,
        0 0 55px #ff176c;

    animation:
        finalPulse
        1.7s
        infinite
        ease-in-out;
}

@keyframes finalPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}


/* =========================
   FLOATING HEARTS
========================= */

.floating-heart{

    position:fixed;

    bottom:-50px;

    font-size:
        20px;

    z-index:1;

    pointer-events:none;

    animation:
        rise
        6s
        linear
        forwards;
}

@keyframes rise{

    0%{
        transform:
            translateY(0)
            rotate(0deg)
            scale(.6);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-110vh)
            rotate(360deg)
            scale(1.4);

        opacity:0;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{
        padding-top:28px;
    }

    .cards{
        gap:18px;
    }

    .roua-image,
    .pou-area{
        height:330px;
    }

    .pou{
        transform:scale(.85);
    }

}

</style>

</head>


<body>


<!-- النجوم -->

<div class="galaxy" id="galaxy"></div>


<div class="container">


    <div class="small-title">
        ✨ قصة ما إلها مثيل ✨
    </div>


    <h1 class="title">
        رؤى 💕
    </h1>


    <div class="description">
        أحلى بوو بالمجرة 🌌😂
    </div>


    <!-- الصور -->

    <div class="cards">


        <!-- رؤى -->

        <div class="card">

            <img
                src="roua.jpg"
                class="roua-image"
                alt="رؤى">

            <div class="card-name">
                رؤى 🩷✨
            </div>

        </div>


        <!-- بو -->

        <div class="card">

            <div class="pou-area">

                <div class="pou">

                    <div class="pou-heart">
                        💕
                    </div>

                    <div class="pou-body">

                        <div class="brow left"></div>
                        <div class="brow right"></div>

                        <div class="eye left"></div>
                        <div class="eye right"></div>

                        <div class="mouth"></div>

                    </div>

                </div>

            </div>

            <div class="card-name">
                بوو 😂
            </div>

        </div>


    </div>


    <!-- الكلام -->

    <div class="message">


        <div class="main-message">

            رؤى
            <span>
                أحلى بوو بالمجرة
            </span>
            🌌😂💕


        </div>


        <div class="similarity">

            يخلق من الشبه أربعين

            <span class="laugh">
                😂😂😂
            </span>

        </div>


        <div class="final">

            أحلى بووووووو 😂💕✨

        </div>


    </div>


</div>


<script>


/* =========================
   STAR GENERATOR
========================= */

const galaxy =
    document.getElementById("galaxy");


for(let i = 0; i < 90; i++){

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random()*100 + "%";

    star.style.top =
        Math.random()*100 + "%";

    star.style.animationDelay =
        Math.random()*3 + "s";

    star.style.animationDuration =
        (1.5 + Math.random()*3) + "s";

    galaxy.appendChild(star);
}


/* =========================
   FLOATING HEARTS
========================= */

const emojis = [
    "💕",
    "💗",
    "💖",
    "🩷",
    "✨",
    "😂"
];


function createHeart(){

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.textContent =
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];

    heart.style.left =
        Math.random()*100 + "%";

    heart.style.animationDuration =
        (4 + Math.random()*4) + "s";

    document.body.appendChild(
        heart
    );


    setTimeout(
        () => heart.remove(),
        9000
    );

}


setInterval(
    createHeart,
    650
);


</script>


</body>

</html>
