<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Heart - WAAD</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#000;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
}

/* =========================
   العنوان
========================= */

.title{
    margin-top:45px;
    margin-bottom:35px;
    font-size:42px;
    font-weight:400;
    letter-spacing:1px;
    text-align:center;

    background:linear-gradient(
        90deg,
        #e7a5c8,
        #ffffff,
        #e7a5c8
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 0 10px rgba(234,128,176,.3);
}

/* =========================
   إطار القلب
========================= */

.heart-box{
    width:92%;
    max-width:680px;
    height:480px;

    border:5px solid #e7b3cd;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 8px rgba(255,180,220,.15);
}

/* =========================
   القلب
========================= */

.heart{
    position:relative;
    width:460px;
    height:400px;
}

/* كل كلمة */

.love{
    position:absolute;

    color:#ea80b0;

    font-size:18px;
    font-weight:500;

    white-space:nowrap;

    text-shadow:
        0 0 5px #ea80b0,
        0 0 10px #ea80b0,
        0 0 18px rgba(255,120,180,.8);

    animation:glow 2.5s infinite alternate;
}

/* إضاءة الكلمات */

@keyframes glow{

    from{
        opacity:.55;
        text-shadow:
            0 0 4px #ea80b0;
    }

    to{
        opacity:1;
        text-shadow:
            0 0 6px #ea80b0,
            0 0 15px #ea80b0,
            0 0 25px #ff9aca;
    }

}

/* =========================
   اسم WAAD بالنص
========================= */

.waad{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:55px;
    font-weight:800;

    letter-spacing:8px;

    color:white;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #ea80b0,
        0 0 30px #ea80b0,
        0 0 55px #ea80b0;

    animation:waadPulse 2s infinite ease-in-out;

    z-index:20;
}

@keyframes waadPulse{

    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.08);
    }

}

/* =========================
   النص تحت القلب
========================= */

.subtitle{

    margin-top:28px;

    font-size:28px;

    color:white;

    text-align:center;

}

.subtitle span{
    color:#e9a0c3;

    text-shadow:
        0 0 10px #ea80b0;
}

/* =========================
   كود CSS تحت
========================= */

.code-box{

    width:92%;
    max-width:620px;

    margin-top:22px;
    margin-bottom:50px;

    border:2px solid #e99bc2;

    border-radius:15px;

    background:#02050b;

    box-shadow:
        0 0 15px rgba(233,155,194,.25);

    padding:25px;

    font-family:
        "Courier New",
        monospace;

    color:#4dc9ff;

    line-height:1.8;

    font-size:15px;

}

.code-title{

    color:#ea80b0;

    margin-bottom:10px;

    font-weight:bold;

}

/* =========================
   موبايل
========================= */

@media(max-width:600px){

    .title{
        font-size:36px;
        margin-top:40px;
        margin-bottom:30px;
    }

    .heart-box{
        width:94%;
        height:430px;
    }

    .heart{
        width:350px;
        height:350px;
        transform:scale(.82);
    }

    .love{
        font-size:15px;
    }

    .waad{
        font-size:43px;
        letter-spacing:6px;
    }

    .subtitle{
        font-size:23px;
    }

    .code-box{
        font-size:12px;
        padding:18px;
    }

}

</style>
</head>

<body>


<!-- =========================
     العنوان
========================= -->

<h1 class="title">
    Love Heart Animation
</h1>


<!-- =========================
     القلب
========================= -->

<div class="heart-box">

    <div class="heart" id="heart">

        <div class="waad">
            WAAD
        </div>

    </div>

</div>


<!-- =========================
     النص
========================= -->

<div class="subtitle">
    Comment <span>"Love"</span> for Code
</div>


<!-- =========================
     صندوق الكود
========================= -->

<div class="code-box">

    <div class="code-title">
        CSS — WAAD LOVE
    </div>

    <div>
        #heart .love {
    </div>

    <div style="color:#e6c36a;">
        color: #ea80b0;
    </div>

    <div style="color:#e6c36a;">
        text-shadow: 0 0 10px #fff;
    </div>

    <div>
        letter-spacing: 2px;
    </div>

    <div>
        animation: glow 2s infinite;
    </div>

    <div>
        }
    </div>

</div>


<script>

/* =========================================
   إنشاء قلب من كلمات I LOVE YOU
========================================= */

const heart = document.getElementById("heart");

const total = 115;

for(let i = 0; i < total; i++){

    const t =
        (Math.PI * 2 * i) / total;

    /*
       معادلة القلب
    */

    const x =
        16 * Math.pow(Math.sin(t),3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    const word =
        document.createElement("div");

    word.className = "love";

    word.textContent = "I LOVE YOU";

    /*
       تكبير القلب
    */

    const scaleX = 13;
    const scaleY = 12;

    word.style.left =
        `calc(50% + ${x * scaleX}px)`;

    word.style.top =
        `calc(50% - ${y * scaleY}px)`;

    /*
       تدوير الكلمات
    */

    const angle =
        Math.atan2(
            -Math.sin(t),
            Math.cos(t)
        ) * 180 / Math.PI;

    word.style.transform =
        `translate(-50%,-50%)
         rotate(${angle}deg)`;

    /*
       حركة مختلفة لكل كلمة
    */

    word.style.animationDelay =
        (Math.random() * 2) + "s";

    heart.appendChild(word);
}

</script>

</body>
</html>
