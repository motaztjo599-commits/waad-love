<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هبة 😂💩 | الموقع الرسمي</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 20%,#4b0c55 0%,#1c0928 28%,#09040e 65%,#000 100%);
}

/* =========================
   الخلفية
========================= */

#stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 6px #fff,
        0 0 15px #ff66cc;
    animation:twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.4);
    }
    50%{
        opacity:1;
        transform:scale(1.8);
    }
}

/* دوائر الإضاءة */

.glow{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:.25;
    pointer-events:none;
    z-index:0;
}

.glow.one{
    width:300px;
    height:300px;
    background:#ff008c;
    top:10%;
    left:-100px;
    animation:move1 8s infinite alternate;
}

.glow.two{
    width:350px;
    height:350px;
    background:#7b00ff;
    bottom:-100px;
    right:-100px;
    animation:move2 9s infinite alternate;
}

@keyframes move1{
    to{
        transform:translate(180px,120px);
    }
}

@keyframes move2{
    to{
        transform:translate(-150px,-120px);
    }
}

/* =========================
   المحتوى
========================= */

.container{
    position:relative;
    z-index:2;

    width:100%;
    max-width:1100px;
    margin:auto;

    min-height:100vh;

    padding:35px 18px 70px;

    text-align:center;
}

/* التحذير */

.warning{
    display:inline-block;

    padding:10px 22px;

    border:1px solid rgba(255,120,200,.5);
    border-radius:50px;

    background:rgba(255,255,255,.07);

    color:#ffd3ee;

    font-size:16px;

    box-shadow:
        0 0 20px rgba(255,0,150,.2);

    backdrop-filter:blur(10px);

    animation:warning 2s infinite alternate;
}

@keyframes warning{
    to{
        box-shadow:
            0 0 30px rgba(255,0,150,.6);
    }
}

/* الاسم */

.name{
    margin-top:18px;

    font-size:clamp(65px,17vw,140px);

    font-weight:1000;

    letter-spacing:-5px;

    color:#fff;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff8bd8,
        0 0 35px #ff20a8,
        0 0 70px #d000ff,
        0 0 120px #8a00ff;

    animation:namePulse 2.5s infinite ease-in-out;
}

@keyframes namePulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.04);
    }
}

.subtitle{
    margin-top:-5px;

    font-size:clamp(18px,4vw,28px);

    color:#ffd5ee;

    text-shadow:
        0 0 10px #ff45b5,
        0 0 25px #9d00ff;
}

/* =========================
   البطاقة الرئيسية
========================= */

.main-card{
    position:relative;

    margin:45px auto 0;

    width:min(900px,96vw);

    padding:45px 20px 50px;

    border-radius:45px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,0,150,.045),
            rgba(100,0,255,.08)
        );

    border:1px solid rgba(255,170,230,.4);

    box-shadow:
        0 0 25px rgba(255,0,170,.25),
        0 0 80px rgba(130,0,255,.15),
        inset 0 0 40px rgba(255,255,255,.04);

    backdrop-filter:blur(18px);

    overflow:hidden;
}

/* لمعان متحرك */

.main-card::before{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    top:-180px;
    left:-150px;

    border-radius:50%;

    background:#ff00a8;

    filter:blur(90px);

    opacity:.18;

    animation:lightMove 6s infinite alternate;
}

@keyframes lightMove{
    to{
        left:80%;
        top:80%;
    }
}

/* =========================
   الإيموجي
========================= */

.big-poop{
    position:relative;
    z-index:3;

    font-size:clamp(90px,22vw,180px);

    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 25px #ff9d00)
        drop-shadow(0 0 55px #ff5c00);

    animation:
        poopBounce 1.8s infinite ease-in-out,
        poopRotate 4s infinite ease-in-out;
}

@keyframes poopBounce{
    0%,100%{
        transform:translateY(0) scale(1);
    }
    50%{
        transform:translateY(-18px) scale(1.08);
    }
}

@keyframes poopRotate{
    0%,100%{
        rotate:-3deg;
    }
    50%{
        rotate:3deg;
    }
}

/* =========================
   النص الضخم
========================= */

.main-title{
    position:relative;
    z-index:3;

    margin-top:5px;

    font-size:clamp(38px,10vw,88px);

    font-weight:1000;

    line-height:1.25;

    color:#fff;

    text-shadow:
        0 0 7px #fff,
        0 0 18px #ff8be0,
        0 0 40px #ff00aa,
        0 0 80px #9d00ff;

    animation:titleGlow 1.8s infinite alternate;
}

@keyframes titleGlow{
    from{
        filter:brightness(1);
    }
    to{
        filter:brightness(1.35);
    }
}

.highlight{
    color:#ff9ee5;

    text-shadow:
        0 0 8px #fff,
        0 0 25px #ff00aa,
        0 0 55px #9d00ff;
}

/* =========================
   الرسالة
========================= */

.message{
    position:relative;
    z-index:3;

    margin:25px auto 0;

    max-width:720px;

    padding:20px;

    border-radius:25px;

    background:rgba(0,0,0,.2);

    border:1px solid rgba(255,255,255,.12);

    color:#ffe9f7;

    font-size:clamp(18px,4vw,28px);

    line-height:1.7;

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.025);
}

/* =========================
   أزرار
========================= */

.buttons{
    position:relative;
    z-index:5;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:15px;

    margin-top:30px;
}

.btn{
    border:none;
    outline:none;

    padding:15px 28px;

    border-radius:50px;

    color:white;

    font-family:inherit;

    font-size:19px;
    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #7b00ff,
            #ff00a8,
            #ff4fc3
        );

    box-shadow:
        0 0 15px rgba(255,0,180,.5),
        0 0 35px rgba(150,0,255,.3);

    transition:.25s;
}

.btn:hover{
    transform:scale(1.08);
}

.btn:active{
    transform:scale(.94);
}

/* =========================
   العداد
========================= */

.counter{
    position:relative;
    z-index:3;

    margin:30px auto 0;

    font-size:20px;

    color:#ffc7e9;
}

#count{
    display:inline-block;

    min-width:60px;

    color:#fff;

    font-size:30px;
    font-weight:900;

    text-shadow:
        0 0 10px #ff00aa,
        0 0 25px #9d00ff;
}

/* =========================
   الإيموجيات الطائرة
========================= */

.floating{
    position:fixed;

    bottom:-70px;

    z-index:1;

    pointer-events:none;

    font-size:28px;

    animation:rise linear forwards;
}

@keyframes rise{
    0%{
        transform:
            translateY(0)
            rotate(0deg)
            scale(.5);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-115vh)
            rotate(420deg)
            scale(1.7);

        opacity:0;
    }
}

/* =========================
   انفجار عند الضغط
========================= */

.explosion{
    position:fixed;

    z-index:20;

    pointer-events:none;

    font-size:30px;

    animation:explode 900ms ease-out forwards;
}

@keyframes explode{
    0%{
        transform:translate(-50%,-50%) scale(.3);
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(500deg)
            scale(1.8);

        opacity:0;
    }
}

/* =========================
   الفوتر
========================= */

.footer{
    position:relative;
    z-index:3;

    margin-top:35px;

    color:#bda5c8;

    font-size:14px;
}

/* =========================
   الموبايل
========================= */

@media(max-width:600px){

    .container{
        padding-top:25px;
    }

    .main-card{
        margin-top:35px;
        padding:35px 14px 40px;
        border-radius:35px;
    }

    .message{
        padding:16px;
    }

    .btn{
        width:90%;
        max-width:330px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="container">

    <div class="warning">
        🚨 الموقع الرسمي لهبة — الدخول على مسؤوليتك 😂
    </div>

    <div class="name">
        هبة 😂
    </div>

    <div class="subtitle">
        🌌 أكبر تحذير رقمي بالتاريخ 🌌
    </div>

    <div class="main-card">

        <div class="big-poop">
            💩
        </div>

        <div class="main-title">
            كلي خرا يا
            <span class="highlight">
                هبة
            </span>
            😂💩
        </div>

        <div class="message">
            😂😂😂<br>
            هبة، تم إصدار الحكم النهائي رسميًا:
            <br>
            <strong>
                💩 كلي خرا 💩
            </strong>
            <br>
            مع كامل الاحترام طبعًا 🤣🔥
        </div>

        <div class="buttons">

            <button class="btn" onclick="laugh()">
                😂 اضغطي هون
            </button>

            <button class="btn" onclick="poopRain()">
                💩 تفعيل الهجوم
            </button>

        </div>

        <div class="counter">
            عدد مرات قول الجملة:
            <span id="count">0</span>
        </div>

    </div>

    <div class="footer">
        صنع خصيصًا لهبة 😂💩✨
    </div>

</div>

<script>

/* =========================
   النجوم
========================= */

const stars =
document.getElementById("stars");

for(let i=0;i<150;i++){

    const star =
    document.createElement("div");

    star.className="star";

    star.style.left =
    Math.random()*100+"%";

    star.style.top =
    Math.random()*100+"%";

    star.style.animationDelay =
    Math.random()*4+"s";

    star.style.animationDuration =
    (1.3 + Math.random()*3)+"s";

    stars.appendChild(star);
}


/* =========================
   الإيموجيات
========================= */

const emojis=[
    "💩",
    "😂",
    "🤣",
    "🔥",
    "💜",
    "💗",
    "✨",
    "😭"
];


/* =========================
   المطر المستمر
========================= */

function createFloating(){

    const item =
    document.createElement("div");

    item.className="floating";

    item.textContent =
    emojis[
        Math.floor(
            Math.random()*emojis.length
        )
    ];

    item.style.left =
    Math.random()*100+"%";

    item.style.animationDuration =
    (4+Math.random()*5)+"s";

    item.style.fontSize =
    (18+Math.random()*25)+"px";

    document.body.appendChild(item);

    setTimeout(()=>{
        item.remove();
    },10000);
}

setInterval(
    createFloating,
    500
);


/* =========================
   العداد
========================= */

let count=0;

function laugh(){

    count++;

    document.getElementById("count")
    .textContent=count;

    explosion(
        window.innerWidth/2,
        window.innerHeight/2
    );
}


/* =========================
   انفجار
========================= */

function explosion(x,y){

    const amount=25;

    for(let i=0;i<amount;i++){

        const item=
        document.createElement("div");

        item.className="explosion";

        item.textContent=
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];

        item.style.left=x+"px";
        item.style.top=y+"px";

        item.style.setProperty(
            "--x",
            ((Math.random()-.5)*500)+"px"
        );

        item.style.setProperty(
            "--y",
            ((Math.random()-.5)*500)+"px"
        );

        document.body.appendChild(item);

        setTimeout(()=>{
            item.remove();
        },1000);
    }
}


/* =========================
   زر الهجوم
========================= */

function poopRain(){

    for(let i=0;i<60;i++){

        setTimeout(()=>{

            const item=
            document.createElement("div");

            item.className="floating";

            item.textContent =
            ["💩","😂","🤣"][Math.floor(Math.random()*3)];

            item.style.left =
            Math.random()*100+"%";

            item.style.bottom =
            Math.random()*40+"px";

            item.style.animationDuration =
            (2+Math.random()*3)+"s";

            document.body.appendChild(item);

            setTimeout(()=>{
                item.remove();
            },6000);

        },i*35);
    }

    count+=10;

    document.getElementById("count")
    .textContent=count;
}


/* =========================
   ضغط الشاشة
========================= */

document.addEventListener(
    "click",
    function(e){

        if(
            e.target.tagName==="BUTTON"
        ) return;

        explosion(e.clientX,e.clientY);
    }
);

</script>

</body>
</html>
