<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رؤى أحلى بوو بالمجرة 🌌💕</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 10%,#5b174d 0%,#25102f 28%,#0b0714 65%,#000 100%);
}

/* ===== النجوم ===== */

#stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px white;
    animation:twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        opacity:.2;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

/* ===== المحتوى ===== */

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:35px 18px 80px;
    text-align:center;
}

/* ===== العنوان ===== */

.top-text{
    font-size:20px;
    color:#ffc1db;
    margin-bottom:8px;
}

h1{
    font-size:clamp(45px,11vw,85px);
    font-weight:900;
    line-height:1.1;
    color:white;
    text-shadow:
        0 0 10px #ffb5d3,
        0 0 25px #ff4d91,
        0 0 55px #ff176c;
    animation:titlePulse 2.5s infinite ease-in-out;
}

@keyframes titlePulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.04);
    }
}

.subtitle{
    margin-top:12px;
    font-size:clamp(20px,5vw,30px);
    color:#ffd9e8;
    text-shadow:0 0 15px #ff4d91;
}

/* ===== البطاقات ===== */

.cards{
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:25px;
    flex-wrap:wrap;
    margin-top:38px;
}

.card{
    width:min(420px,94vw);
    padding:10px;
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,180,215,.45);

    box-shadow:
        0 0 30px rgba(255,40,130,.2),
        inset 0 0 25px rgba(255,255,255,.04);

    backdrop-filter:blur(12px);

    animation:cardFloat 4s ease-in-out infinite;
}

.card:nth-child(2){
    animation-delay:-2s;
}

@keyframes cardFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-9px);
    }
}

/* ===== صورة رؤى ===== */

.roua-image{
    width:100%;
    height:400px;
    object-fit:cover;
    display:block;
    border-radius:23px;

    box-shadow:
        0 0 25px rgba(255,75,145,.4);
}

.card-title{
    padding:15px 5px 10px;
    font-size:27px;
    font-weight:900;
    color:#ffd5e5;

    text-shadow:
        0 0 10px #ff5b9d;
}

/* ===== بوو ===== */

.pou-box{
    height:400px;
    border-radius:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #ffc6a5 0%,
            #b96865 38%,
            #54283e 70%,
            #160b1d 100%
        );
}

/* جسم بوو */

.pou{
    position:relative;
    width:220px;
    height:260px;

    animation:pouMove 1.8s ease-in-out infinite;
}

@keyframes pouMove{
    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-12px) rotate(2deg);
    }
}

.pou-body{
    position:absolute;
    left:25px;
    bottom:0;

    width:170px;
    height:205px;

    border-radius:
        48% 48% 43% 43%;

    background:
        radial-gradient(
            circle at 38% 28%,
            #e5aa86,
            #a95d57 62%,
            #6c3a43 100%
        );

    box-shadow:
        inset -15px -20px 30px rgba(50,15,25,.35),
        0 15px 30px rgba(0,0,0,.5);
}

/* العيون */

.eye{
    position:absolute;

    top:70px;

    width:24px;
    height:31px;

    background:#17121a;

    border-radius:50%;

    z-index:3;

    box-shadow:
        inset 5px 5px 0 rgba(255,255,255,.8);
}

.eye.left{
    left:61px;
}

.eye.right{
    right:61px;
}

/* الحواجب */

.brow{
    position:absolute;

    top:57px;

    width:39px;
    height:6px;

    border-radius:10px;

    background:#63333a;
}

.brow.left{
    left:48px;
    transform:rotate(-10deg);
}

.brow.right{
    right:48px;
    transform:rotate(10deg);
}

/* الفم */

.mouth{
    position:absolute;

    left:50%;
    top:120px;

    transform:translateX(-50%);

    width:50px;
    height:25px;

    border-bottom:
        5px solid #3b1c2a;

    border-radius:
        0 0 50px 50px;
}

/* القلب */

.pou-heart{
    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    font-size:42px;

    z-index:5;

    filter:
        drop-shadow(0 0 10px #ff6c9e);
}

/* ===== الرسالة ===== */

.message{
    margin-top:38px;
    padding:32px 18px 38px;

    border-radius:32px;

    background:
        linear-gradient(
            135deg,
            rgba(255,50,140,.17),
            rgba(100,50,255,.13)
        );

    border:
        1px solid rgba(255,170,205,.35);

    box-shadow:
        0 0 40px rgba(255,40,130,.18),
        inset 0 0 30px rgba(255,255,255,.025);
}

.main-message{
    font-size:clamp(28px,7vw,55px);
    font-weight:900;
    line-height:1.4;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff7eaf,
        0 0 45px #ff2478;
}

.main-message span{
    color:#ff9fc3;
}

.similarity{
    margin-top:22px;

    font-size:clamp(21px,5vw,34px);
    font-weight:900;

    color:#ffe0eb;

    text-shadow:
        0 0 10px #ff70a5;
}

.final{
    margin-top:22px;

    font-size:clamp(32px,8vw,60px);
    font-weight:900;

    color:#ff9fc3;

    text-shadow:
        0 0 10px #ffb5d0,
        0 0 25px #ff4f91,
        0 0 55px #ff176c;

    animation:finalPulse 1.7s infinite ease-in-out;
}

@keyframes finalPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.07);
    }
}

/* ===== القلوب الطائرة ===== */

.floating{
    position:fixed;
    bottom:-60px;

    z-index:1;

    pointer-events:none;

    font-size:22px;

    animation:
        rise 6s linear forwards;
}

@keyframes rise{
    0%{
        transform:
            translateY(0)
            rotate(0)
            scale(.6);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-110vh)
            rotate(360deg)
            scale(1.5);

        opacity:0;
    }
}

/* ===== زر البداية ===== */

.start-button{
    display:inline-block;

    margin-top:30px;

    padding:14px 28px;

    border-radius:50px;

    color:white;

    text-decoration:none;

    font-size:20px;
    font-weight:bold;

    background:
        linear-gradient(
            90deg,
            #ff3f8e,
            #a43cff
        );

    box-shadow:
        0 0 20px rgba(255,60,140,.4);

    transition:.3s;
}

.start-button:hover{
    transform:scale(1.06);
}

/* ===== الهاتف ===== */

@media(max-width:600px){

    .container{
        padding:
            28px
            14px
            70px;
    }

    .cards{
        gap:18px;
    }

    .roua-image,
    .pou-box{
        height:340px;
    }

    .pou{
        transform:scale(.85);
    }

    .message{
        padding:
            27px
            14px
            32px;
    }
}
</style>
</head>


<body>

<!-- النجوم -->
<div id="stars"></div>


<div class="container">

    <div class="top-text">
        ✨ قصة ما إلها مثيل ✨
    </div>

    <h1>
        رؤى 💕
    </h1>

    <div class="subtitle">
        أحلى بوو بالمجرة 🌌😂
    </div>


    <!-- الصور -->
    <div class="cards">

        <!-- صورة رؤى -->
        <div class="card">

            <img
                src="roua.jpg"
                class="roua-image"
                alt="رؤى"
            >

            <div class="card-title">
                رؤى 🩷✨
            </div>

        </div>


        <!-- بوو -->
        <div class="card">

            <div class="pou-box">

                <div class="pou">

                    <div class="pou-heart">
                        💕
                    </div>

                    <div class="pou-body">

                        <div class="brow left"></div>
                        <div class="brow right"></div>

                        <div class="eye left"></div>
                        <div class="eye right"></div>

                        <div class="mouth"></div>

                    </div>

                </div>

            </div>

            <div class="card-title">
                بوو 😂
            </div>

        </div>

    </div>


    <!-- الكلام -->
    <div class="message">

        <div class="main-message">
            رؤى
            <span>أحلى بوو بالمجرة</span>
            🌌😂💕
        </div>

        <div class="similarity">
            يخلق من الشبه أربعين 😂😂😂
        </div>

        <div class="final">
            أحلى بووووووو 😂💕✨
        </div>

        <a href="#" class="start-button">
            اضغطي هون يا بوو 😂💕
        </a>

    </div>

</div>


<script>

/* =========================
   إنشاء النجوم
========================= */

const stars =
    document.getElementById("stars");

for(let i = 0; i < 110; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    star.style.animationDuration =
        (1.5 + Math.random() * 3) + "s";

    stars.appendChild(star);
}


/* =========================
   القلوب والرموز الطائرة
========================= */

const emojis = [
    "💕",
    "💗",
    "💖",
    "🩷",
    "✨",
    "😂",
    "🌌"
];

function createFloating(){

    const item =
        document.createElement("div");

    item.className = "floating";

    item.textContent =
        emojis[
            Math.floor(
                Math.random() * emojis.length
            )
        ];

    item.style.left =
        Math.random() * 100 + "%";

    item.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, 9000);
}

setInterval(
    createFloating,
    650
);

</script>

</body>
</html>
